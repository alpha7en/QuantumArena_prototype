<!DOCTYPE html>
<html lang="ru">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #111827;
      --card-border: #1f293d;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
    }
    body {
      background-color: var(--bg-dark);
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .grid-bg {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .canvas-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      cursor: grab;
      position: absolute;
    }
    .canvas-card:active {
      cursor: grabbing;
    }
    .canvas-card:hover {
      border-color: rgba(6, 182, 212, 0.6);
      box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      z-index: 40;
    }
    .canvas-card.highlighted {
      border-color: #06b6d4 !important;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.6) !important;
      transform: scale(1.02);
      z-index: 50 !important;
    }
    .canvas-card.dimmed {
      opacity: 0.2;
      filter: grayscale(80%);
    }
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
    }
    /* Group Frame */
    .group-frame {
      position: absolute;
      border: 1px dashed rgba(255, 255, 255, 0.12);
      background: rgba(15, 23, 42, 0.4);
      border-radius: 16px;
      pointer-events: none;
      z-index: 1;
    }
    .group-label {
      position: absolute;
      top: -14px;
      left: 20px;
      padding: 2px 12px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    svg line, svg path {
      pointer-events: none;
    }
  </style>
</head>

    // RENDERING & INTERACTION LOGIC
    const viewport = document.getElementById('viewport');
    const canvasSpace = document.getElementById('canvasSpace');
    const cardsLayer = document.getElementById('cardsLayer');
    const groupsLayer = document.getElementById('groupsLayer');
    const svgConnectors = document.getElementById('svgConnectors');
    const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');
    const searchInput = document.getElementById('searchInput');

    let scale = 0.65;
    let panX = 100;
    let panY = 120;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    function renderCanvas() {
      // 1. Render Group Frames
      groupsLayer.innerHTML = canvasData.groups.map(g => `
        <div class="group-frame" style="left: ${g.x}px; top: ${g.y}px; width: ${g.w}px; height: ${g.h}px; border-color: ${g.color}40;">

            ${g.label}
          </div>
        </div>
      `).join('');

      // 2. Render Cards
      cardsLayer.innerHTML = canvasData.nodes.map(n => {
        const colorMap = {
          cyan: 'border-cyan-800/80 bg-slate-900/90 text-cyan-400',
          emerald: 'border-emerald-800/80 bg-slate-900/90 text-emerald-400',
          amber: 'border-amber-800/80 bg-slate-900/90 text-amber-400',
          rose: 'border-rose-800/80 bg-slate-900/90 text-rose-400',
          purple: 'border-purple-800/80 bg-slate-900/90 text-purple-400'
        };

        const badgeHtml = n.badges.map(b => {
          if (b === 'MVP') return '<span class="px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-700/60 font-bold">🎯 MVP</span>';
          if (b === 'RESEARCH') return '<span class="px-1.5 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-700/60 font-bold">❓ Непонятно</span>';
          if (b === 'NUANCE') return '<span class="px-1.5 py-0.5 rounded bg-purple-950 text-purple-300 border border-purple-700/60">💡 Нюанс</span>';
          if (b === 'SECURITY') return '<span class="px-1.5 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-700/60 font-bold">🛡️ Защита</span>';
          if (b === 'RISK') return '<span class="px-1.5 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-700/60">⚠️ Риск</span>';
          if (b === 'ROLES') return '<span class="px-1.5 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-700/60">👥 Роли</span>';
          return `<span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">${b}</span>`;
        }).join(' ');

        return `
          <div id="node-${n.id}" class="canvas-card rounded-2xl border p-5 shadow-xl backdrop-blur-md ${colorMap[n.color] || colorMap.cyan}"
            style="left: ${n.x}px; top: ${n.y}px; width: ${n.w}px; min-height: ${n.h}px;"
            onclick="openNodeDetails('${n.id}')">
            
            <div class="flex items-start justify-between gap-2 mb-2">
              <h3 class="text-sm font-bold text-slate-100 leading-snug">${n.title}</h3>
              <div class="flex flex-wrap gap-1 items-center justify-end text-[10px]">
                ${badgeHtml}
              </div>
            </div>
            
            <p class="text-xs text-slate-400 mb-3 border-b border-slate-800 pb-2">${n.desc}</p>
            
            <ul class="space-y-1.5 text-xs text-slate-300">
              ${n.points.map(p => `<li class="flex items-start gap-1.5"><span class="text-cyan-400 select-none">•</span><span>${p}</span></li>`).join('')}
            </ul>
          </div>
        `;
      }).join('');

      // 3. Render SVG Connectors
      renderConnectors();
    }

    function renderConnectors() {
      const nodeMap = {};
      canvasData.nodes.forEach(n => nodeMap[n.id] = n);

      let svgHtml = '';
      canvasData.edges.forEach(e => {
        const from = nodeMap[e.from];
        const to = nodeMap[e.to];
        if (!from || !to) return;

        // Calculate center or side points
        const x1 = from.x + from.w / 2;
        const y1 = from.y + from.h / 2;
        const x2 = to.x + to.w / 2;
        const y2 = to.y + to.h / 2;

        const dx = x2 - x1;
        const dy = y2 - y1;
        const cx1 = x1 + dx * 0.4;
        const cy1 = y1;
        const cx2 = x1 + dx * 0.6;
        const cy2 = y2;

        svgHtml += `
          <path d="M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}" 
            stroke="${e.color || '#475569'}" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.45" />
        `;
      });
      svgConnectors.innerHTML = svgHtml;
    }

    function updateTransform() {
      canvasSpace.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      zoomLevelDisplay.textContent = Math.round(scale * 100) + '%';
    }

    function zoomStep(delta) {
      const oldScale = scale;
      scale = Math.min(Math.max(0.2, scale + delta), 2.0);
      updateTransform();
    }

    function resetZoomAndCenter() {
      scale = 0.65;
      panX = 100;
      panY = 120;
      updateTransform();
    }

    function zoomToFit() {
      scale = 0.35;
      panX = 50;
      panY = 50;
      updateTransform();
    }

    // PANNING WITH MOUSE / TRACKPAD
    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.canvas-card') || e.target.closest('button') || e.target.closest('input')) return;
      isPanning = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      viewport.classList.add('cursor-grabbing');
      viewport.classList.remove('cursor-grab');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      viewport.classList.add('cursor-grab');
      viewport.classList.remove('cursor-grabbing');
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) {
        // Pinch zoom
        const zoomDelta = -e.deltaY * 0.005;
        scale = Math.min(Math.max(0.2, scale + zoomDelta), 2.0);
      } else {
        // 2-finger Pan
        panX -= e.deltaX;
        panY -= e.deltaY;
      }
      updateTransform();
    }, { passive: false });

    // FILTERING
    function filterByBadge(badge) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('bg-cyan-600', 'text-white'));
      event.target.classList.add('bg-cyan-600', 'text-white');

      canvasData.nodes.forEach(n => {
        const el = document.getElementById(`node-${n.id}`);
        if (!el) return;
        if (badge === 'ALL' || n.badges.includes(badge)) {
          el.classList.remove('dimmed');
        } else {
          el.classList.add('dimmed');
        }
      });
    }

    // SEARCH
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        document.querySelectorAll('.canvas-card').forEach(c => {
          c.classList.remove('dimmed', 'highlighted');
        });
        return;
      }

      let firstMatch = null;

      canvasData.nodes.forEach(n => {
        const el = document.getElementById(`node-${n.id}`);
        if (!el) return;
        const text = (n.title + ' ' + n.desc + ' ' + n.points.join(' ') + ' ' + n.badges.join(' ')).toLowerCase();
        if (text.includes(q)) {
          el.classList.remove('dimmed');
          el.classList.add('highlighted');
          if (!firstMatch) firstMatch = n;
        } else {
          el.classList.add('dimmed');
          el.classList.remove('highlighted');
        }
      });

      if (firstMatch) {
        panX = -firstMatch.x * scale + viewport.clientWidth / 2 - (firstMatch.w * scale) / 2;
        panY = -firstMatch.y * scale + viewport.clientHeight / 2 - (firstMatch.h * scale) / 2;
        updateTransform();
      }
    });

    // SIDE DRAWER
    function openNodeDetails(id) {
      const n = canvasData.nodes.find(item => item.id === id);
      if (!n) return;

      document.getElementById('drawerTitle').textContent = n.title;
      document.getElementById('drawerBody').innerHTML = `
        <div class="p-4 rounded-xl bg-slate-800/80 border border-slate-700">
          <span class="text-[10px] text-cyan-400 uppercase font-bold tracking-wider">Категория: ${n.type}</span>
          <p class="text-sm font-medium text-slate-200 mt-1">${n.desc}</p>
        </div>

        <div>
          <h4 class="text-xs font-bold text-slate-300 mb-2 uppercase tracking-wide">Ключевые пункты и формулировки:</h4>
          <div class="space-y-2">
            ${n.points.map(p => `
              <div class="p-3 rounded-lg bg-slate-800/40 border border-slate-800 flex items-start gap-2">
                <span class="text-cyan-400">▹</span>
                <span class="text-slate-300 text-xs">${p}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="p-4 rounded-xl bg-purple-950/30 border border-purple-800/50">
          <h4 class="text-xs font-bold text-purple-300 mb-1 flex items-center gap-1.5">
            <i class="fa-solid fa-lightbulb"></i> Фокус для обсуждения на созвоне:
          </h4>
          <p class="text-[11px] text-purple-200/90 leading-normal">
            Использовать этот блок для фиксации конкретных вопросов команде: согласны ли с разделением, кто берет задачу в спринт, какие технологические риски видим.
          </p>
        </div>
      `;
      document.getElementById('sideDrawer').classList.remove('translate-x-full');
    }

    function toggleSideInfo() {
      const drawer = document.getElementById('sideDrawer');
      if (drawer.classList.contains('translate-x-full')) {
        document.getElementById('drawerTitle').textContent = 'Генеральный монолог & Структура';
        document.getElementById('drawerBody').innerHTML = `
          <div class="p-4 rounded-xl bg-cyan-950/40 border border-cyan-800/60">
            <h4 class="text-xs font-bold text-cyan-300">О проекте «Квантовый LeetCode»</h4>
            <p class="text-xs text-slate-300 mt-1">
              Платформа соревновательного и практического квантового программирования. Содержит модульный симулятор с динамическим обновлением, проверяющую систему с защитой от читерства и банк задач на синтез квантовых схем.
            </p>
          </div>
          <div class="space-y-3">
            <h4 class="text-xs font-bold text-slate-300 uppercase">14 Ключевых Разделов:</h4>
            <ol class="space-y-2 text-xs text-slate-400 list-decimal pl-4">
              <li><b class="text-slate-200">Общая платформа:</b> профиль, каталог, UX Split-view.</li>
              <li><b class="text-slate-200">Квантовый симулятор:</b> песочница, drag-and-drop, корзина, control gates, CAS-распознаватель, 3D Блох.</li>
              <li><b class="text-slate-200">Шаблонизация задач:</b> тип ответа, фиксированные vs параметризованные цепи.</li>
              <li><b class="text-slate-200">Начальные состояния:</b> |0...0⟩, произвольные, параметризованные.</li>
              <li><b class="text-slate-200">Динамические цепи («Серая зона»):</b> измерения, feedback.</li>
              <li><b class="text-slate-200">Бенчмаркинг & Шаблоны:</b> QCoder, Katas, IBM.</li>
              <li><b class="text-slate-200">Ограничения базисов:</b> Universal, Restricted, Hardware-native.</li>
              <li><b class="text-slate-200">Auto-Judge:</b> WASM клиент vs Server gVisor, Statevector vs Shots.</li>
              <li><b class="text-slate-200">Безопасность (3 уровня):</b> RCE хоста, API Qiskit, Anti-Auto-Synthesis.</li>
              <li><b class="text-slate-200">Умные ограничения:</b> Позитивные контракты без портянок запретов.</li>
              <li><b class="text-slate-200">Масштабирование:</b> FastAPI, Celery, C++ QSim ядро.</li>
              <li><b class="text-slate-200">17 Столпов Архитектуры:</b> Сводная системная карта.</li>
              <li><b class="text-slate-200">18 R&D Вопросов:</b> Список тем для исследования («Куда копать»).</li>
              <li><b class="text-slate-200">MVP Прототип & Команда:</b> Скоуп к созвону и 4 роли команды.</li>
            </ol>
          </div>
        `;
        drawer.classList.remove('translate-x-full');
      } else {
        drawer.classList.add('translate-x-full');
      }
    }

    function closeSideDrawer() {
      document.getElementById('sideDrawer').classList.add('translate-x-full');
    }

    // INIT
    renderCanvas();
    updateTransform();
  </script>
</body>
</html>
