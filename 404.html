<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>sparq arena</title>
<script>
  // Прямые ссылки вида /QuantumArena_prototype/tasks/1 → /QuantumArena_prototype/#/tasks/1
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var base = location.hostname.slice(-10) === '.github.io' && parts.length ? '/' + parts[0] + '/' : '/';
    var rest = location.pathname.slice(base.length).replace(/^\/+/, '').replace(/\.html$/, '');
    location.replace(base + '#/' + rest + location.search);
  })();
</script></head>
<body><p>Перенаправление… <a href="./">на главную</a></p></body></html>
