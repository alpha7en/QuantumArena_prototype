# Дерево классификации банка задач sparq arena.
# Ствол (trunk) — архетип: задаётся сигнатурой «что на входе → что сдаётся → как проверяется».
# Ветвь (branch) — ключевая концепция внутри архетипа. Плоды — задачи (bank/core, bank/reserve).
# Стволы T1–T6 — шесть архетипов из материалов команды; T7–T8 — расширение из каталога
# разнородных задач (там это T7, T8, T10; коррекция ошибок T9 живёт в T6).
version: 1
trunks:
  - id: T1
    title: Подготовка состояния
    signature: {input: zero, check: eq0_phase}
    about: Получить заданное состояние из $|0\dots0\rangle$.
    branches:
      - {id: T1.1, title: Однокубитные состояния и фазы, idea: 'Амплитуды и относительная фаза одного кубита: H, фазовые гейты, повороты.'}
      - {id: T1.2, title: Запутанные пары и GHZ, idea: 'H и CX порождают корреляцию; знак и чётность задаются одним гейтом.'}
      - {id: T1.3, title: Амплитудная инженерия, idea: 'Неравные веса: каскад управляемых поворотов с расчётными углами (W, Дике).'}
      - {id: T1.4, title: Графовые и стабилизаторные состояния, idea: 'Состояние задаётся графом: $|+\rangle^{\otimes n}$ и CZ по рёбрам.'}
      - {id: T1.5, title: Состояния по классическим данным, idea: 'Генератор читает число или строку и строит разреженное или «обрезанное» состояние.'}
      - {id: T1.6, title: Подготовка под бюджет глубины и связность, idea: 'Знакомое состояние, но наивная схема не проходит лимит: дерево, середина цепочки.'}
  - id: T2
    title: Синтез преобразования
    signature: {input: any, check: eq_phase}
    about: Собрать оператор, верный на любом входе, в рамках базиса и бюджета.
    branches:
      - {id: T2.1, title: Тождества и сопряжения, idea: 'Сопряжение меняет ось: $HZH=X$, поворот переводит CX в CH.'}
      - {id: T2.2, title: Разложение в заданный базис, idea: 'Многокубитный гейт выражается через CX и однокубитные; считаем CX и T.'}
      - {id: T2.3, title: Перестановки кубитов, idea: 'SWAP, разворот и сдвиг как произведение слоёв; глубина вместо числа гейтов.'}
      - {id: T2.4, title: Диагональные операторы и фазы, idea: 'Диагональ раскладывается по чётностям битов: Z, CZ, фазовые полиномы.'}
      - {id: T2.5, title: Преобразование Фурье и спектральные блоки, idea: 'QFT как каскад H и управляемых фаз; порядок битов и знак угла.'}
      - {id: T2.6, title: Отражения и точная фаза, idea: 'Отражение — знак на одном состоянии; глобальная фаза становится наблюдаемой под управлением.'}
  - id: T3
    title: Оракулы и обратимая арифметика
    signature: {input: reg_anc, check: eq_anc_phase}
    about: Вычислить классическую функцию обратимо и вернуть вспомогательные кубиты в $|0\rangle$.
    branches:
      - {id: T3.1, title: Битовые оракулы, idea: '$|x\rangle|y\rangle\to|x\rangle|y\oplus f(x)\rangle$: XOR складывается гейтами CX, И — гейтом CCX.'}
      - {id: T3.2, title: Фазовые оракулы, idea: '$|x\rangle\to(-1)^{f(x)}|x\rangle$: метка знаком, вычисление «на месте» и откат.'}
      - {id: T3.3, title: Сравнения и предикаты, idea: 'Равенство и «меньше» раскладываются по битам на непересекающиеся условия.'}
      - {id: T3.4, title: Арифметика на месте, idea: 'Инкремент, сложение, отрицание как перестановка базисных состояний без мусора.'}
      - {id: T3.5, title: Развычисление и бюджет анцилл, idea: 'Вычислить — применить — развычислить; чистые и заимствованные анциллы.'}
  - id: T4
    title: Алгоритмы с чёрным ящиком
    signature: {input: oracle, check: prob}
    about: Оракул выдаёт платформа; нужно построить алгоритм вокруг него и уложиться в число вызовов.
    branches:
      - {id: T4.1, title: Один запрос, idea: 'Суперпозиция, оракул, интерференция: Дойч — Йожа и Бернштейн — Вазирани.'}
      - {id: T4.2, title: Усиление амплитуды, idea: 'Два отражения дают поворот; число итераций $\approx\frac{\pi}{4}\sqrt{N}$.'}
      - {id: T4.3, title: Оценка фазы, idea: 'Фаза собственного значения переносится в регистр и читается обратным QFT.'}
      - {id: T4.4, title: Скрытая структура, idea: 'Измерения дают линейные уравнения на секрет: Саймон, поиск периода.'}
      - {id: T4.5, title: Сравнение состояний и различение ящиков, idea: 'Swap-тест, тест Адамара, определение неизвестного гейта за малое число вызовов.'}
  - id: T5
    title: Ограничения железа
    signature: {input: any, check: eq_phase}
    about: Знакомая операция в условиях реального процессора — базис, связность, стоимость, шум.
    branches:
      - {id: T5.1, title: Нативный базис, idea: 'Гейты выражаются через набор процессора: $\{CZ, R_z, \sqrt{X}\}$.'}
      - {id: T5.2, title: Связность и маршрутизация, idea: 'Двухкубитный гейт только между соседями: мост дешевле перестановок.'}
      - {id: T5.3, title: Стоимость и оптимизация схемы, idea: 'Та же матрица меньшим числом гейтов; задачи с оценкой по стоимости.'}
      - {id: T5.4, title: Отказоустойчивая стоимость, idea: 'Дорогой ресурс — T-гейты; фазовый полином и счёт T.'}
      - {id: T5.5, title: Шум и подавление ошибок, idea: 'Лишние гейты стоят точности; свёртка схемы и экстраполяция к нулевому шуму.'}
  - id: T6
    title: Измерения, динамические схемы и коррекция ошибок
    signature: {input: promise, check: channel}
    about: Схемы с измерениями и классической обратной связью; кодирование, синдромы, исправление.
    branches:
      - {id: T6.1, title: Базисы измерения и различение состояний, idea: 'Измерение в другом базисе — это поворот перед измерением в вычислительном.'}
      - {id: T6.2, title: Обратная связь по измерению, idea: 'Результат измерения управляет следующим гейтом: сброс, телепортация.'}
      - {id: T6.3, title: Кодирование и синдромы, idea: 'Логический кубит в нескольких физических; синдром — чётности без чтения данных.'}
      - {id: T6.4, title: Декодирование и исправление, idea: 'Синдром отображается в исправляющий гейт.'}
  - id: T7
    title: Протоколы, игры и криптография
    signature: {input: resource, check: prob}
    about: Несколько участников делят запутанность; проверяется вероятность успеха протокола.
    branches:
      - {id: T7.1, title: Плотное кодирование и обмен запутанностью, idea: 'Пара Белла как ресурс: два бита одним кубитом, запутанность между незнакомыми.'}
      - {id: T7.2, title: Нелокальные игры, idea: 'Квантовая стратегия выигрывает чаще любой классической: CHSH, GHZ, магический квадрат.'}
      - {id: T7.3, title: Распределение ключа, idea: 'Измерение в чужом базисе оставляет след: BB84, просеивание, оценка QBER.'}
  - id: T8
    title: Моделирование и вариационные схемы
    signature: {input: zero, check: eq_phase}
    about: Эволюция под гамильтонианом, слои вариационных алгоритмов, оценка градиентов и наблюдаемых.
    branches:
      - {id: T8.1, title: Экспоненты паулиевых операторов, idea: '$e^{-i\theta P}$: смена базиса, лестница CX, один поворот $R_z$.'}
      - {id: T8.2, title: Троттеризация, idea: 'Эволюция как произведение коротких шагов; коммутирующие слагаемые идут параллельно.'}
      - {id: T8.3, title: Вариационные слои и оптимизация, idea: 'Слой QAOA: фаза стоимости и смеситель; граф задачи задаёт гейты.'}
      - {id: T8.4, title: Градиенты и наблюдаемые, idea: 'Производная по параметру — разность двух запусков; оценка по выборке.'}
