statement: |
  Гейт `oracle` на одном кубите — это либо $Z$, либо $S$. Напишите функцию `solve(oracle)`, которая возвращает
  схему на одном кубите с одним классическим битом. Результат измерения должен быть 0, если в ящике $Z$, и 1,
  если $S$, — с вероятностью 1.

  **Разрешено:** гейты $H$, $X$, измерение в конце; оракул — не больше двух раз.
hints:
  - 'Одного вызова недостаточно: состояния $Z|+\rangle$ и $S|+\rangle$ не ортогональны.'
  - 'Сравните квадраты гейтов.'
editorial: |
  $H$, оракул, оракул, $H$, измерение. Для $Z$ два вызова дают $I$, и $HH|0\rangle=|0\rangle$. Для $S$ два вызова
  дают $Z$, и $HZH|0\rangle=|1\rangle$.
pitfalls:
  - 'Один вызов: для $S$ результат случаен.'
