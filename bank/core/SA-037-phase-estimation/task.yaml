id: SA-037
slug: phase-estimation
title: Оценка фазы в t битах
status: reference
level: 3
tree: {trunk: T4, branch: T4.3, hybrid: [T2.5]}
facets:
  input: oracle
  answer: generator
  params: [{name: t, kind: size, range: [1, 5]}, {name: cu, kind: circuit, note: 'управляемый $U$ на двух кубитах: [управляющий, целевой]'}]
  gates: {mode: basis, set: [h, x, cp, swap]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: final
  check: prob
qubits: {data: 't+1'}
limits: {oracle_calls: '2**t-1'}
signature: 'solve(t: int, cu: Gate) -> QuantumCircuit'
method:
  kind: combo
  elements: [фазовый откат, степени оператора, обратное преобразование Фурье]
  key_idea: 'Счётный кубит $j$ получает фазу $2\pi\varphi\,2^j$; регистр оказывается в образе Фурье числа $2^t\varphi$.'
source: {kind: adapted, ref: 'IBM Quantum Challenge Spring 2023, Lab 3; QuantumKatas PhaseEstimation; ladder_ec C10', note: 'условие написано для банка: оператор передаётся чёрным ящиком'}
gui: false
io:
  input: 'управляемый $U$, $U|1\rangle=e^{2\pi i\varphi}|1\rangle$, $\varphi=m/2^t$'
  output: 'измерение счётного регистра даёт $m$ с вероятностью 1'
statement: |
  Оператор $U$ на одном кубите имеет собственный вектор $|1\rangle$: $U|1\rangle=e^{2\pi i\varphi}|1\rangle$,
  $U|0\rangle=|0\rangle$. Известно, что $\varphi=m/2^t$ для целого $0\le m<2^t$. Платформа передаёт управляемый
  $U$ как гейт `cu` на двух кубитах: `qc.append(cu, [управляющий, целевой])`.

  Напишите функцию `solve(t, cu)` для $1\le t\le 5$. Она возвращает схему на $t+1$ кубите с $t$ классическими
  битами: кубиты $0,\dots,t-1$ — счётный регистр (кубит $i$ измеряется в бит $i$), кубит $t$ — рабочий. Результат
  измерения, прочитанный как число $\sum_i c_i2^i$, должен быть равен $m$ с вероятностью 1.

  **Разрешено:** гейты $H$, $X$, управляемая фаза (`cp`), $SWAP$, измерения в конце; гейт `cu` — не больше
  $2^t-1$ раз.
hints:
  - 'Рабочий кубит нужно перевести в собственное состояние $|1\rangle$.'
  - 'Счётный кубит $j$ управляет $2^j$ вызовами $U$.'
  - 'Состояние счётного регистра перед измерением — образ Фурье числа $m$ (см. SA-016).'
editorial: |
  $X$ на рабочем кубите, $H$ на счётных. Счётный кубит $j$ управляет $U^{2^j}$ — это $2^j$ вызовов `cu`, всего
  $2^t-1$. Регистр оказывается в состоянии $\frac{1}{\sqrt{2^t}}\sum_k e^{2\pi i\,mk/2^t}|k\rangle$; обратное
  преобразование Фурье (схема SA-016 в обратном порядке с углами противоположного знака) переводит его в $|m\rangle$.
pitfalls:
  - 'Прямое преобразование Фурье вместо обратного: получается $-m \bmod 2^t$.'
  - 'Рабочий кубит в $|0\rangle$: фазы нет.'
