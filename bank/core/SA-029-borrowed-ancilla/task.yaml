io:
  input: 'произвольное состояние пяти кубитов'
  output: '$q_3\leftarrow q_3\oplus q_0q_1q_2$, кубит $q_4$ не меняется'
statement: |
  Реализуйте гейт $X$ с тремя управляющими кубитами: $q_3$ инвертируется, когда $q_0=q_1=q_2=1$. В вашем
  распоряжении кубит $q_4$, но он **занят**: находится в произвольном неизвестном состоянии и может быть запутан с
  остальными. После схемы он обязан остаться в том же состоянии. Схема должна быть верна для любого состояния
  всех пяти кубитов.

  **Разрешено:** только гейты $CCX$; не больше 4 гейтов.
hints:
  - 'С чистой анциллой хватило бы трёх гейтов. Что пойдёт не так, если анцилла равна 1?'
  - 'Примените пару гейтов дважды и посмотрите, что сократится.'
editorial: |
  `ccx(0, 1, 4)`, `ccx(4, 2, 3)`, `ccx(0, 1, 4)`, `ccx(4, 2, 3)`. Пусть в $q_4$ лежит $g$. После первых двух гейтов
  в $q_3$ добавлено $(g\oplus q_0q_1)q_2$, третий гейт возвращает $g$, четвёртый добавляет $g\,q_2$. В сумме
  остаётся $q_0q_1q_2$ при любом $g$.
pitfalls:
  - 'Три гейта, как с чистой анциллой: при $g=1$ ответ неверен.'
