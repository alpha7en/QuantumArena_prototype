  key_idea: 'Неизвестное значение заимствованного кубита входит в ответ дважды и сокращается: $(g\oplus ab)c\oplus gc=abc$.'
source: {kind: adapted, ref: 'A. Barenco et al., 1995, лемма 7.3', note: 'условие написано для банка'}
