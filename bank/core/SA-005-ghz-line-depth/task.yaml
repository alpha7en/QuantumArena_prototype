facets:
  input: zero
  answer: generator
  params: [{name: n, kind: size, range: [2, 12]}]
  gates: {mode: basis, set: [h, cx]}
  coupling: line
  ancilla: {kind: none, max: 0}
  measure: none
  check: eq0_phase
qubits: {data: n}
