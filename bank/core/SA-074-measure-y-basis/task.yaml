  key_idea: 'Измерение в базисе $Y$ — это $S^\dagger$ и $H$ перед обычным измерением: $S^\dagger$ переводит $|\pm i\rangle$ в $|\pm\rangle$, $H$ — в $|0\rangle$ и $|1\rangle$.'
source: {kind: adapted, ref: 'QuantumKatas Measurements (различение двух ортогональных состояний); демо v2 (measure-y)', note: 'пара состояний заменена собственными состояниями $Y$'}
