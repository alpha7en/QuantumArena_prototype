io:
  input: '$|{+i}\rangle$ или $|{-i}\rangle$'
  output: 'бит $c_0$: 0 для $|{+i}\rangle$, 1 для $|{-i}\rangle$'
statement: |
  Кубит находится в одном из двух состояний:
  $$|{+i}\rangle=\frac{1}{\sqrt2}\left(|0\rangle+i|1\rangle\right)\qquad\text{или}\qquad
    |{-i}\rangle=\frac{1}{\sqrt2}\left(|0\rangle-i|1\rangle\right).$$
  Постройте схему с одним классическим битом $c_0$, которая определяет состояние наверняка: $c_0=0$ для
  $|{+i}\rangle$ и $c_0=1$ для $|{-i}\rangle$.

  **Разрешено:** гейты $H$, $S$, $S^\dagger$ и одно измерение в конце; не больше 2 гейтов.
hints:
  - 'Задача «плюс или минус» решается одним $H$. Каким гейтом превратить $|{\pm i}\rangle$ в $|\pm\rangle$?'
editorial: |
  $S^\dagger=\mathrm{diag}(1,-i)$ убирает множитель $i$: $|{+i}\rangle\to|+\rangle$, $|{-i}\rangle\to|-\rangle$.
  Затем $H$ переводит $|+\rangle$ в $|0\rangle$, а $|-\rangle$ в $|1\rangle$, и измерение даёт ответ с
  вероятностью 1. С гейтом $S$ вместо $S^\dagger$ ответы поменяются местами.
pitfalls:
  - 'Один $H$: оба исхода равновероятны для каждого из состояний.'
  - 'Гейт $S$ вместо $S^\dagger$: ответы меняются местами.'
  - 'Порядок «$H$, затем $S^\dagger$»: фазовый гейт перед измерением ни на что не влияет.'
