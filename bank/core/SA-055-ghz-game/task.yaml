io:
  input: 'состояние $\frac{1}{\sqrt2}(|000\rangle+|111\rangle)$; вопросы $r,s,t$ с чётным числом единиц'
  output: 'ответы $a,b,c$ с $a\oplus b\oplus c=r\vee s\vee t$ — всегда'
statement: |
  Три игрока делят состояние $\frac{1}{\sqrt2}(|000\rangle+|111\rangle)$ и не общаются. Рефери даёт им биты
  $r,s,t$; обещано, что единиц среди них чётное число (тройки $000$, $011$, $101$, $110$). Каждый игрок применяет
  к своему кубиту операцию, зависящую от своего бита, и измеряет его; результаты — ответы $a,b,c$. Игроки
  выигрывают, если $a\oplus b\oplus c=r\vee s\vee t$. Классически нельзя выигрывать чаще чем в 75 % случаев.

  Напишите функцию `solve(bit)` — операцию одного игрока на одном кубите (стратегия у всех троих одинаковая).
  Игроки должны выигрывать с вероятностью 1 на каждой из четырёх троек.

  **Разрешено:** гейты $H$, $S$, $S^\dagger$, $X$, $Z$; не больше 2 гейтов.
hints:
  - 'Измерение в базисе $X$ — это $H$ перед измерением; в базисе $Y$ — $S^\dagger$, затем $H$.'
  - 'Чему равно произведение трёх результатов измерения $X$ на GHZ?'
editorial: |
  При вопросе 0 игрок измеряет $X$ ($H$), при вопросе 1 — $Y$ ($S^\dagger$, $H$). Состояние GHZ — собственное
  для $XXX$ с значением $+1$ и для $XYY$, $YXY$, $YYX$ с значением $-1$. Значит, сумма ответов по модулю 2 равна 0
  для тройки $000$ и 1 для остальных — в точности $r\vee s\vee t$.
pitfalls:
  - 'Измерять $X$ при любом вопросе: выигрыш только на тройке $000$.'
