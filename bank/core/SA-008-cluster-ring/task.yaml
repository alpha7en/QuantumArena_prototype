io:
  input: '$|0\dots0\rangle$, кольцо из $n$ кубитов'
  output: '$\prod_{i} CZ_{i,\,i+1 \bmod n}\,|+\rangle^{\otimes n}$'
statement: |
  $n$ кубитов ($3\le n\le 12$) соединены в кольцо: кубит $i$ связан с кубитом $(i+1) \bmod n$. Напишите функцию
  `solve(n)`, которая возвращает схему, готовящую из $|0\dots0\rangle$ кластерное состояние кольца
  $$|C_n\rangle=\prod_{i=0}^{n-1} CZ_{i,\,(i+1)\bmod n}\;|+\rangle^{\otimes n}.$$

  **Разрешено:** гейты $H$ и $CZ$ между соседями по кольцу; глубина не больше 4.
hints:
  - 'Все гейты $CZ$ диагональны и коммутируют: их можно переставлять как угодно.'
  - 'Сколько слоёв нужно, чтобы покрыть все рёбра кольца непересекающимися парами при чётном и при нечётном $n$?'
editorial: |
  Слой $H$, затем рёбра $(i,i+1)$ с чётным $i$, затем с нечётным. При чётном $n$ замыкающее ребро $(n-1,0)$
  помещается во второй слой, при нечётном требует третьего. Глубина 3 или 4.
pitfalls:
  - 'Гейты $CZ$ подряд по кругу в одну «лесенку»: глубина $n+1$.'
  - 'Забытое замыкающее ребро: получается линейный кластер.'
