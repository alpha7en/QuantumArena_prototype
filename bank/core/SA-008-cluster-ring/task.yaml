  key_idea: 'Гейты $CZ$ коммутируют, поэтому рёбра кольца красятся в 2 или 3 цвета — по слою на цвет.'
source: {kind: adapted, ref: 'презентация классификации, T1.4 (линейный кластер)', note: 'добавлены кольцо и бюджет глубины'}
