statement: |
  Процессор выполняет гейты $CZ$, $R_z(\lambda)$ и $\sqrt{X}$ (`sx`). Реализуйте гейт $CX$ с управляющим кубитом
  $q_0$ и целевым $q_1$ с точностью до глобальной фазы.

  **Разрешено:** гейты $CZ$, $R_z$, $\sqrt{X}$; не больше 7 гейтов, из них один двухкубитный.
hints:
  - 'Чем $CX$ отличается от $CZ$? Вспомните $HZH=X$.'
editorial: |
  Адамар на целевом кубите (три нативных гейта), $CZ$, снова Адамар. Всего $3+1+3=7$ гейтов.
pitfalls:
  - 'Адамары на управляющем кубите вместо целевого: получается $CX$ в обратную сторону.'
