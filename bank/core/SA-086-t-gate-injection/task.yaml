id: SA-086
slug: t-gate-injection
title: Гейт T через магическое состояние
status: reference
level: 3
tree: {trunk: T6, branch: T6.2, hybrid: [T5.4]}
facets:
  input: any
  answer: dynamic
  params: []
  gates: {mode: basis, set: [h, t, s, z, cx]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: mid
  check: channel
qubits: {data: 2}
limits: {gates: 4, cx: 1, t: 1, measurements: 1}
signature: 'solve() -> QuantumCircuit'
method:
  kind: combo
  elements: [телепортация гейта, магическое состояние, условная клиффордова поправка, бюджет CX]
  key_idea: 'Гейт $T$ применяется к вспомогательному кубиту заранее; $CX$ и измерение переносят его действие на данные, а ошибка при «плохом» исходе — это $T^\dagger$ вместо $T$, её исправляет $S$.'
source: {kind: adapted, ref: 'D. Gottesman, I. Chuang, 1999 (телепортация гейтов); S. Bravyi, A. Kitaev, 2005 (магические состояния)', note: 'условие написано заново; идея SR-128 резерва перенесена в ядро'}
gui: true
io:
  input: '$|\psi\rangle$ на кубите $q_0$, кубит $q_1$ в $|0\rangle$'
  output: 'кубит $q_0$ в состоянии $T|\psi\rangle$ при любом исходе измерения'
statement: |
  В отказоустойчивом компьютере гейт $T=\mathrm{diag}\left(1,e^{i\pi/4}\right)$ нельзя применить к логическому
  кубиту с данными напрямую. Вместо этого отдельно готовят «магическое состояние» и вводят его в схему
  клиффордовыми гейтами и измерением.

  Кубит $q_0$ находится в произвольном состоянии $|\psi\rangle$, кубит $q_1$ — в $|0\rangle$. Постройте схему с
  одним классическим битом, после которой кубит $q_0$ находится в состоянии $T|\psi\rangle$ (с точностью до
  глобальной фазы) при любом результате измерения. Гейт $T$ разрешён только на вспомогательном кубите $q_1$.
  Что останется в $q_1$, неважно.

  **Разрешено:** $H$ и $T$ на кубите $q_1$; $CX$; $S$ и $Z$ на любом кубите, в том числе под классическим
  условием (`with qc.if_test((бит, 1)):`); одно измерение. Не больше 4 гейтов, из них один $CX$ и один $T$.
hints:
  - 'Приготовьте в $q_1$ состояние $T|+\rangle=\frac{1}{\sqrt2}\left(|0\rangle+e^{i\pi/4}|1\rangle\right)$ и примените `cx(0, 1)`. Что остаётся в $q_0$, если измерение $q_1$ дало 0? А если 1?'
  - 'При исходе 1 на данных оказывается $T^\dagger$ вместо $T$. Чему равно $T\cdot\left(T^\dagger\right)^{-1}$?'
editorial: |
  $H$ и $T$ готовят в $q_1$ состояние $\frac{1}{\sqrt2}\left(|0\rangle+\omega|1\rangle\right)$, $\omega=e^{i\pi/4}$.
  После `cx(0, 1)` для $|\psi\rangle=\alpha|0\rangle+\beta|1\rangle$ (первым записан $q_0$):
  $$\frac{1}{\sqrt2}\Big(\alpha|0\rangle\left(|0\rangle+\omega|1\rangle\right)+\beta|1\rangle\left(|1\rangle+\omega|0\rangle\right)\Big).$$
  Измерение $q_1$: при исходе 0 в $q_0$ остаётся $\alpha|0\rangle+\omega\beta|1\rangle=T|\psi\rangle$; при исходе 1
  — $\omega\alpha|0\rangle+\beta|1\rangle\simeq T^\dagger|\psi\rangle$. Во втором случае условный
  $S=T^2$ даёт $S\,T^\dagger=T$. Итого: $H$, $T$, $CX$, измерение, условный $S$. Весь «неклиффордов» ресурс
  сосредоточен в заранее приготовленном состоянии — его можно очищать отдельно (дистилляция магических состояний).

  Унитарный вариант «`cx(0, 1)`, $T$ на $q_1$, `cx(0, 1)`» тоже применяет $T$ к данным, но требует двух $CX$.
pitfalls:
  - 'Нет условной поправки: в половине запусков к данным применён $T^\dagger$.'
  - 'Поправка $Z$ вместо $S$: $Z\,T^\dagger\ne T$.'
  - 'Гейт $T$ прямо на $q_0$: нарушен контракт задачи.'
  - 'Вычисление и откат двумя $CX$ без измерения: бюджет $CX$ превышен.'
