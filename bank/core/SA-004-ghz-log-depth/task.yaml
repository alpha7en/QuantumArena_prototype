io:
  input: '$|0\dots0\rangle$'
  output: '$\frac{1}{\sqrt{2}}\left(|0\dots0\rangle-|1\dots1\rangle\right)$'
statement: |
  Напишите функцию `solve(n)`, которая для $2\le n\le 16$ возвращает схему на $n$ кубитах. Схема переводит
  $|0\dots0\rangle$ в состояние
  $$\frac{1}{\sqrt{2}}\left(|0\dots0\rangle-|1\dots1\rangle\right).$$

  **Разрешено:** гейты $H$, $X$, $Z$, $CX$ между любыми кубитами; глубина схемы не больше 6.
hints:
  - 'Цепочка $CX$ имеет глубину $n$. Какие гейты $CX$ можно выполнять одновременно?'
  - 'Кубит, который уже запутан, сам может быть управляющим.'
editorial: |
  После $H$ и $Z$ на кубите 0 он находится в $\frac{1}{\sqrt2}(|0\rangle-|1\rangle)$. Далее слоями: если запутаны
  кубиты $0,\dots,k-1$, один слой гейтов $CX(j, j+k)$ добавляет ещё $k$ кубитов. За $t$ слоёв набирается $2^t$
  кубитов, для $n\le16$ хватает четырёх слоёв. Глубина: $2+\lceil\log_2 n\rceil\le 6$.
pitfalls:
  - 'Цепочка или «звезда» от кубита 0: глубина растёт как $n$.'
  - 'Забытый знак: дерево без $Z$ даёт GHZ с плюсом.'
