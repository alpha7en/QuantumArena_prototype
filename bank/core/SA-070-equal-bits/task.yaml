gui: true
io:
  input: '$|a\rangle|b\rangle|0\rangle$ на кубитах $q_0,q_1,q_2$'
  output: '$|a\rangle|b\rangle|[a=b]\rangle$'
statement: |
  На кубитах $q_0$ и $q_1$ записаны биты $a$ и $b$, кубит $q_2$ находится в $|0\rangle$. Запишите в $q_2$
  единицу, если $a=b$, и ноль иначе:
  $$|a\rangle|b\rangle|0\rangle\;\longmapsto\;|a\rangle\,|b\rangle\,|[a=b]\rangle .$$
  Кубиты $q_0$ и $q_1$ должны остаться прежними; схема проверяется и на суперпозициях входов.

  **Разрешено:** гейты $X$ и $CX$; не больше 3 гейтов.
hints:
  - 'Чему равно $a\oplus b$, когда биты совпадают?'
editorial: |
  `cx(0, 2)` и `cx(1, 2)` собирают в $q_2$ сумму $a\oplus b$ — она равна 1, когда биты различны. Гейт $X$ на
  $q_2$ превращает «различны» в «равны». Входные кубиты служат только управляющими и не меняются.
pitfalls:
  - 'Без завершающего $X$ в ответе признак неравенства.'
  - 'Гейт $CX$ между входными кубитами: сумма попадает в $q_1$ и портит вход.'
