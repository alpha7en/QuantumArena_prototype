statement: |
  Реализуйте гейт $SWAP$, который меняет местами состояния двух кубитов:
  $|a\rangle|b\rangle\to|b\rangle|a\rangle$ для базисных состояний и по линейности для любых суперпозиций.

  **Разрешено:** только гейт $CX$ (в любом направлении); не больше 3 гейтов.
hints:
  - 'Классический приём: обменять два числа без третьей переменной тремя операциями XOR.'
  - 'Направление $CX$ должно чередоваться.'
editorial: |
  `cx(0, 1)`, `cx(1, 0)`, `cx(0, 1)`. На базисных состояниях: после первого гейта $(a,\,a\oplus b)$, после
  второго $(b,\,a\oplus b)$, после третьего $(b,\,a)$. Схема из $CX$ переставляет базисные состояния без фаз,
  поэтому верна и на суперпозициях.
pitfalls:
  - 'Два $CX$: один из кубитов остаётся с суммой $a\oplus b$.'
  - 'Три $CX$ в одном направлении: два из них сокращаются, остаётся один $CX$.'
