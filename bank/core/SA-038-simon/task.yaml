id: SA-038
slug: simon
title: Алгоритм Саймона целиком
status: reference
level: 3
tree: {trunk: T4, branch: T4.4}
facets:
  input: oracle
  answer: hybrid
  params:
    - {name: n, kind: size, range: [2, 5]}
    - {name: oracle, kind: circuit, note: 'гейт на $2n$ кубитах'}
