io:
  input: 'произвольное состояние трёх кубитов'
  output: '$|x\rangle\to e^{i\frac{\pi}{4}(x_0\oplus x_1\oplus x_2)}|x\rangle$'
statement: |
  Реализуйте диагональный оператор на трёх кубитах, который умножает базисное состояние
  $|x\rangle=|x_2x_1x_0\rangle$ на $e^{i\pi/4}$, если в строке нечётное число единиц, и не меняет его иначе:
  $$U|x\rangle=e^{\,i\frac{\pi}{4}\left(x_0\oplus x_1\oplus x_2\right)}|x\rangle .$$
  Схема должна быть верна для любого входа, с точностью до глобальной фазы.

  В отказоустойчивых вычислениях гейты $CX$ дёшевы, а гейт $T=\mathrm{diag}\left(1,e^{i\pi/4}\right)$ дорог,
  поэтому бюджет — один $T$.

  **Разрешено:** гейты $T$ и $CX$; не больше 5 гейтов, из них один $T$.
hints:
  - 'Гейт $T$ на кубите со значением $v$ даёт множитель $e^{i\frac{\pi}{4}v}$. Какое значение должно оказаться в кубите в момент применения $T$?'
  - 'После гейта $T$ кубит нужно вернуть к исходному значению — фаза при этом останется.'
editorial: |
  `cx(0, 2)` и `cx(1, 2)` записывают в $q_2$ чётность $x_0\oplus x_1\oplus x_2$. Гейт $T$ на $q_2$ умножает
  состояние на $e^{i\frac{\pi}{4}(x_0\oplus x_1\oplus x_2)}$. Те же два $CX$ в обратном порядке возвращают $q_2$ к
  значению $x_2$; фаза — это число при базисном состоянии, откат её не трогает. Любой диагональный оператор из
  $CX$ и $T$ раскладывается на такие слагаемые — «фазовый полином», а число $T$ равно числу слагаемых с нечётным
  коэффициентом. Три гейта $T$ на трёх кубитах дают другую фазу: $e^{i\frac{\pi}{4}(x_0+x_1+x_2)}$ с обычной суммой.
pitfalls:
  - 'Гейт $T$ на каждом кубите: фаза зависит от числа единиц, а не от чётности, и бюджет $T$ превышен.'
  - 'Нет отката: фаза верная, но в $q_2$ осталась чётность вместо $x_2$.'
  - 'Чётность только двух битов: фаза не зависит от третьего.'
