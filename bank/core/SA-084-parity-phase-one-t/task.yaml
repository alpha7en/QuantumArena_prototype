  kind: constraint
  elements: [фазовый полином, чётность через CX, вычисление на месте и откат, бюджет T]
  key_idea: 'Гейты $CX$ собирают чётность $x_0\oplus x_1\oplus x_2$ в одном кубите; один $T$ на нём ставит фазу, зависящую только от чётности; те же $CX$ возвращают кубит.'
source: {kind: adapted, ref: 'M. Amy, D. Maslov, M. Mosca, 2014 (фазовые полиномы и счёт T)', note: 'один член фазового полинома как отдельная задача'}
