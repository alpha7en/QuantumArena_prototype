slug: toffoli-from-csx
title: Тоффоли из управляемого корня
status: reference
level: 3
tree: {trunk: T2, branch: T2.2}
facets:
  input: any
  answer: fixed
  params: []
  gates: {mode: basis, set: [csx, cx]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: none
  check: eq_phase
qubits: {data: 3}
limits: {gates: 6, two_qubit: 6}
signature: 'solve() -> QuantumCircuit'
method:
  kind: combo
  elements: [управляемый корень из $X$, чётность управляющих, обратный гейт из имеющихся, бюджет двухкубитных гейтов]
  key_idea: 'Два управляющих бита дают на целевом $V^{a}\,(V^\dagger)^{a\oplus b}\,V^{b}$ с $V=\sqrt{X}$: при $a=b=1$ это $V^2=X$, иначе $I$. Обратного гейта в наборе нет, но $V^\dagger=V\cdot X$.'
source: {kind: adapted, ref: 'A. Barenco и др., 1995 (Elementary gates for quantum computation, конструкция из пяти двухкубитных гейтов); IBM Quantum Challenge 2021, Ex. 1', note: 'набор без $\sqrt{X}^\dagger$: обратный гейт нужно собрать'}
gui: true
io:
  input: 'произвольное состояние трёх кубитов'
  output: '$CCX$: управление $q_0,q_1$, цель $q_2$'
statement: |
  Реализуйте гейт Тоффоли: кубит $q_2$ переворачивается, если $q_0=q_1=1$. Однокубитных гейтов нет — только два
  двухкубитных: $CX$ и управляемый корень из $X$ (`csx`), который применяет к целевому кубиту
  $$V=\sqrt{X}=\frac12\begin{pmatrix}1+i&1-i\\1-i&1+i\end{pmatrix},\qquad V^2=X,$$
  если управляющий равен 1. Обратного гейта $V^\dagger$ в наборе нет.

  **Разрешено:** гейты $CX$ и `csx` между любыми парами кубитов; не больше 6 гейтов.
hints:
  - 'Если применить $V$ под управлением $q_1$, затем $V$ под управлением $q_0$, то при $q_0=q_1=1$ получится $X$. Но при одной единице останется лишний $V$ — его нужно отменить гейтом $V^\dagger$, управляемым чётностью $q_0\oplus q_1$.'
  - '$V^4=I$, поэтому $V^\dagger=V^3=V\cdot X$.'
editorial: |
  Конструкция Баренко: `csx(1, 2)`; `cx(0, 1)` — теперь в $q_1$ чётность $a\oplus b$; управляемый $V^\dagger$ от
  $q_1$ к $q_2$; `cx(0, 1)` — возвращает $q_1$; `csx(0, 2)`. На целевом кубите получается
  $V^{a}\,(V^\dagger)^{a\oplus b}\,V^{b}$: при $a=b=1$ это $V^2=X$, при одной единице $V^\dagger V=I$, при нулях $I$.

  Управляемый $V^\dagger$ собирается из набора: $V^\dagger=V^3=V\cdot X$, то есть `csx(1, 2)` и `cx(1, 2)` подряд.
  Итого 6 двухкубитных гейтов: `csx(1, 2)`, `cx(0, 1)`, `csx(1, 2)`, `cx(1, 2)`, `cx(0, 1)`, `csx(0, 2)`. Ни одного
  гейта $T$ и ни одного однокубитного гейта; матрица совпадает с $CCX$ точно, без фаз.
pitfalls:
  - 'В середине $V$ вместо $V^\dagger$: при одной единице на целевом остаётся $V^2=X$ — кубит переворачивается по ИЛИ, а не по И.'
  - 'Забыт второй `cx(0, 1)`: в $q_1$ остаётся чётность.'
  - 'Нет последнего `csx(0, 2)`: при $q_0=q_1=1$ на целевом только $V$.'
