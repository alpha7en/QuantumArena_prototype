id: SA-010
slug: uniform-below-l
title: Равная суперпозиция первых L чисел
status: reference
level: 3
tree: {trunk: T1, branch: T1.5, hybrid: [T1.3]}
facets:
  input: zero
  answer: generator
  params:
    - {name: n, kind: size, range: [1, 10]}
    - {name: L, kind: data, note: 'целое, $1\le L\le 2^n$'}
  gates: {mode: basis, set: [h, x, ry, cry, ch]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: none
  check: eq0_phase
qubits: {data: n}
limits: {gates: '7*n'}
signature: 'solve(n: int, L: int) -> QuantumCircuit'
method:
  kind: combo
  elements: [двоичное разложение L, расчётные углы, управление по нулю, параметры n и L]
  key_idea: 'Отрезок $[0,L)$ режется на блоки-степени двойки по единицам числа $L$; вес блока задаёт один поворот.'
source: {kind: real, ref: 'QCoder QPC001 C1, C2', note: 'условие написано заново; эталон по идее A. Shukla, P. Vedula, 2024 (arXiv:2306.11747)'}
gui: false
io:
  input: '$|0\dots0\rangle$; число $L$'
  output: '$\frac{1}{\sqrt{L}}\sum_{x=0}^{L-1}|x\rangle$'
statement: |
  Напишите функцию `solve(n, L)`. Она возвращает схему на $n$ кубитах ($1\le n\le 10$), которая переводит
  $|0\dots0\rangle$ в равную суперпозицию первых $L$ базисных состояний ($1\le L\le 2^n$):
  $$\frac{1}{\sqrt{L}}\sum_{x=0}^{L-1}|x\rangle .$$
  Кубит $i$ — бит $i$ числа $x$.

  **Разрешено:** гейты $H$, $X$, $R_y$, управляемый $R_y$ (`cry`), управляемый $H$ (`ch`); не больше $7n$ гейтов;
  вспомогательных кубитов нет.
hints:
  - 'Если $L$ — степень двойки, достаточно гейтов $H$.'
  - 'Запишите $L$ в двоичном виде. Числа от $0$ до $L-1$ делятся на блоки: у блока фиксирован префикс, а младшие биты свободны.'
  - 'Гейты с управлением по одному кубиту достаточно: условие «все старшие единицы числа $L$ уже на месте» выполняется автоматически.'
editorial: |
  Пусть единицы числа $L$ стоят в позициях $l_0<l_1<\dots<l_k$. Гейты $X$ на $l_1,\dots,l_k$ дают префикс
  последнего блока, $H$ на кубитах ниже $l_0$ делают его равномерным; его вес должен быть $2^{l_0}/L$. Поворот
  $R_y$ на кубите $l_1$ оставляет в нём единицу с этой вероятностью. В ветви, где кубит $l_1$ стал нулём,
  управляемые по нулю $H$ на кубитах $l_0,\dots,l_1-1$ делают равномерным следующий блок размера $2^{l_1}$.
  Далее так же: поворот на $l_{m+1}$, управляемый нулём на $l_m$, и управляемые $H$. Все управления одиночные,
  гейтов $O(n)$.
pitfalls:
  - 'Гейты $H$ на $\lceil\log_2 L\rceil$ кубитах: суперпозиция степени двойки, лишние состояния.'
  - 'Знак угла: $R_y(\theta)|1\rangle=-\sin\frac{\theta}{2}|0\rangle+\cos\frac{\theta}{2}|1\rangle$.'
