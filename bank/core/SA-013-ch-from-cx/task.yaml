  output: 'управляемый $H$: управляющий $q_0$, целевой $q_1$'
statement: |
  Реализуйте управляемый гейт Адамара: если кубит $q_0$ равен 1, к кубиту $q_1$ применяется $H$, иначе ничего не
  происходит. Схема должна быть верна для любого входа, глобальная фаза не учитывается.

  **Разрешено:** гейты $R_y(\theta)$ с любым углом и $CX$; не больше 3 гейтов, из них один $CX$.
hints:
  - 'Если $A A^{-1}=I$ и $A\,X\,A^{-1}=H$, то схема «$A^{-1}$, $CX$, $A$» на целевом кубите — управляемый $H$.'
  - '$H=\frac{1}{\sqrt2}(X+Z)$ — отражение относительно оси посередине между $x$ и $z$.'
editorial: |
  `ry(π/4)` на $q_1$, затем `cx(0, 1)`, затем `ry(-π/4)` на $q_1$. При $q_0=0$ повороты сокращаются. При $q_0=1$
  получается $R_y(-\frac{\pi}{4})\,X\,R_y(\frac{\pi}{4})=\frac{1}{\sqrt2}(X+Z)=H$.
pitfalls:
  - 'Углы с обратными знаками дают $\frac{1}{\sqrt2}(X-Z)$, а не $H$.'
