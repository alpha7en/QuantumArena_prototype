io:
  input: '$|0000\rangle$ на цепочке $q_0 - q_1 - q_2 - q_3$'
  output: 'кубиты $q_0$ и $q_3$ в состоянии $|\Phi^+\rangle$ при любых исходах измерений'
statement: |
  Четыре кубита в состоянии $|0000\rangle$ соединены в цепочку $q_0 - q_1 - q_2 - q_3$. Постройте схему с двумя
  классическими битами, после которой крайние кубиты $q_0$ и $q_3$ находятся в состоянии
  $|\Phi^+\rangle=\frac{1}{\sqrt2}(|00\rangle+|11\rangle)$ — при любых результатах измерений.

  **Разрешено:** гейты $H$, $X$, $Z$, $CX$ между соседями, измерения и гейты под классическим условием; не
  больше 3 гейтов $CX$ и 2 измерений.
hints:
  - 'Цепочка из трёх $CX$ даёт GHZ на четырёх кубитах, но распутать средние кубиты гейтами уже не на что.'
  - 'Создайте две пары Белла и измерьте средние кубиты в базисе Белла.'
editorial: |
  Пары Белла на $(q_0,q_1)$ и $(q_2,q_3)$ — два $CX$. Третий $CX$ и $H$ измеряют $q_1,q_2$ в базисе Белла. Это
  телепортация состояния кубита $q_1$ на $q_3$: поправки $X$ и $Z$ на $q_3$ по результатам измерений возвращают
  пару $(q_0,q_3)$ в $|\Phi^+\rangle$.
pitfalls:
  - 'Без поправок пара $(q_0,q_3)$ оказывается в одном из четырёх состояний Белла — каком именно, зависит от исхода.'
