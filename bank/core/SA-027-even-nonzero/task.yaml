id: SA-027
slug: even-nonzero
title: Чётный, но не ноль
aliases: [SA-205]
status: reference
level: 3
tree: {trunk: T3, branch: T3.5, hybrid: [T3.1]}
facets:
  input: reg_anc
  answer: generator
  params: [{name: n, kind: size, range: [2, 7]}]
  gates: {mode: basis, set: [x, cx, mcx]}
  coupling: all
  ancilla: {kind: clean, max: 1}
  measure: none
  check: eq_anc_phase
qubits: {data: 'n+1', ancilla_max: 1}
