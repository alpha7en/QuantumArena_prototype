  output: '$CCX$: управляющие $q_0$, $q_1$, целевой $q_2$'
statement: |
  Реализуйте гейт Тоффоли: кубит $q_2$ инвертируется, когда $q_0=q_1=1$. Схема должна быть верна для любого
  входа, глобальная фаза не учитывается.

  **Разрешено:** гейты $H$, $T$, $T^\dagger$, $CX$; не больше 16 гейтов, из них не больше 6 $CX$ и не больше 7
  гейтов $T$ и $T^\dagger$ вместе.
hints:
  - '$CCX=H_2\cdot CCZ\cdot H_2$, а $CCZ$ — диагональный гейт.'
  - 'Гейт $T$ на кубите, где сейчас лежит чётность $a\oplus b$, добавляет фазу $\frac{\pi}{4}(a\oplus b)$.'
editorial: |
  $CCZ$ — фаза $\pi\,abc$. Тождество из ключевой идеи выражает её через семь чётностей с весами $\pm\frac{\pi}{4}$.
  Шесть гейтов $CX$ по очереди собирают на кубитах нужные чётности, на каждой ставится $T$ или $T^\dagger$, в конце
  кубиты возвращаются к исходным значениям. Два $H$ на целевом кубите превращают $CCZ$ в $CCX$.
pitfalls:
  - 'Вариант с тремя $CX$ и четырьмя $T$ (Тоффоли «с точностью до относительной фазы») верен на базисных входах, но не как оператор.'
