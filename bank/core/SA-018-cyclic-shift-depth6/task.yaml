  key_idea: 'Сдвиг — это два разворота; разворот — один слой непересекающихся $SWAP$.'
source: {kind: real, ref: 'QCoder QPC004 A3', note: 'условие написано заново; эталон совпадает по идее с ladder_ec Q08 (shift_reversals)'}
