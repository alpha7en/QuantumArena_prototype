signature: 'solve() -> dict  # encode, decode, sift, check'
method:
  kind: transfer
  elements: [сопряжённые базисы, просеивание, оценка доли ошибок]
  key_idea: 'Перехват в случайном базисе портит четверть просеянных битов; порог 11 % отделяет шум от атаки.'
source: {kind: real, ref: 'НТО, профиль «Квантовый инжиниринг» (протокол BB84)', note: 'условие и контракт функций написаны для банка'}
gui: false
io:
  input: 'случайные биты и базисы Алисы, базисы Боба; канал с перехватом или без'
  output: 'просеянные ключи, доля ошибок, решение о прерывании'
statement: |
  Реализуйте протокол BB84. Функция `solve()` возвращает словарь из четырёх функций:

  - `encode(bit, basis)` — схема на одном кубите: Алиса кодирует бит в базисе $Z$ (`basis=0`: $|0\rangle,|1\rangle$)
    или $X$ (`basis=1`: $|+\rangle,|-\rangle$);
  - `decode(basis)` — схема на одном кубите с одним классическим битом: Боб измеряет в выбранном базисе;
  - `sift(alice_bases, bob_bases, bits)` — оставляет из списка `bits` позиции, где базисы совпали;
  - `check(key_a, key_b)` — возвращает пару `(qber, abort)`: долю несовпавших битов и `True`, если она больше
    $0{,}11$.

  Платформа прогоняет 2000 кубитов через канал — без перехвата и с перехватчиком, который измеряет каждый кубит в
  случайном базисе и пересылает результат. Без перехвата просеянные ключи должны совпасть, с перехватом протокол
  должен прерваться.

  **Разрешено:** в схемах — гейты $X$, $H$ и одно измерение; не больше 2 гейтов.
hints:
  - 'В базисе $X$ бит 0 кодируется как $|+\rangle$: сначала бит, потом $H$.'
  - 'Измерение в базисе $X$ — это $H$ перед измерением.'
editorial: |
  `encode`: $X$ при `bit=1`, затем $H$ при `basis=1`. `decode`: $H$ при `basis=1`, измерение. `sift`: фильтр по
  равенству базисов. `check`: отношение числа несовпадений к длине ключа. Перехватчик в половине случаев выбирает
  не тот базис и тогда в половине случаев портит бит — ожидаемая доля ошибок $25\,\%$.
pitfalls:
  - 'Измерять всегда в базисе $Z$: ошибки появляются и без перехвата.'
