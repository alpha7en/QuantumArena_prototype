  key_idea: 'В базисе $X$ управляющий и целевой кубиты $CX$ меняются ролями: $(H\otimes H)\,CX_{0\to1}\,(H\otimes H)=CX_{1\to0}$.'
source: {kind: own, ref: 'sparq arena (демо v2, задача flip-cx)'}
gui: true
io:
  input: 'произвольное состояние двух кубитов'
  output: '$CX$ с управляющим $q_1$ и целевым $q_0$'
statement: |
  На процессоре гейт $CX$ между кубитами $q_0$ и $q_1$ выполняется только в одном направлении: управляющий —
  $q_0$, целевой — $q_1$ (`cx(0, 1)`). Реализуйте $CX$ в обратном направлении: управляющий — $q_1$, целевой —
  $q_0$. Схема должна быть верна для любого входа.

  **Разрешено:** гейт $H$ на любом кубите и `cx(0, 1)`; не больше 5 гейтов, из них один $CX$.
hints:
  - 'Гейт $CZ$ симметричен: у него нет управляющего и целевого. А $CX$ — это $CZ$, окружённый гейтами $H$ на одном из кубитов.'
editorial: |
  $H$ на обоих кубитах, `cx(0, 1)`, снова $H$ на обоих. Объяснение: $CX_{0\to1}=H_1\,CZ\,H_1$, поэтому после
  сопряжения получается $H_0H_1H_1\,CZ\,H_1H_1H_0=H_0\,CZ\,H_0=CX_{1\to0}$ — гейт $CZ$ симметричен, и $H$ вокруг
  кубита $q_0$ делают целевым его.
pitfalls:
  - 'Гейты $H$ только на одном кубите: получается $CZ$ с лишними $H$, а не развёрнутый $CX$.'
  - 'Гейт `cx(1, 0)` напрямую: такого направления на процессоре нет.'
