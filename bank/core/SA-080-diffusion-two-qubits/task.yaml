io:
  input: 'произвольное состояние двух кубитов'
  output: '$2|s\rangle\langle s|-I$, где $|s\rangle=\frac12\left(|00\rangle+|01\rangle+|10\rangle+|11\rangle\right)$'
statement: |
  Пусть $|s\rangle=\frac12\left(|00\rangle+|01\rangle+|10\rangle+|11\rangle\right)$. Реализуйте оператор диффузии
  Гровера на двух кубитах
  $$D=2\,|s\rangle\langle s|-I$$
  с точностью до глобальной фазы.

  **Разрешено:** гейты $H$, $X$, $Z$, $CZ$; не больше 7 гейтов, из них один $CZ$.
hints:
  - '$D=(H\otimes H)\left(2|00\rangle\langle00|-I\right)(H\otimes H)$. На слои $H$ уходит 4 гейта, на середину остаётся 3.'
  - 'Выпишите диагональ $2|00\rangle\langle00|-I$ и диагональ $CZ$. Какими однокубитными гейтами одна превращается в другую?'
editorial: |
  Середина — диагональ $(1,-1,-1,-1)$. Привычная схема «$X$ на обоих, $CZ$, $X$ на обоих» даёт
  $(-1,1,1,1)$ — то же с точностью до фазы, но это 5 гейтов, а вместе со слоями $H$ — 9. Короче так:
  $Z\otimes Z=\mathrm{diag}(1,-1,-1,1)$, $CZ=\mathrm{diag}(1,1,1,-1)$, их произведение — ровно $(1,-1,-1,-1)$.
  Итого: $H$, $H$, $Z$, $Z$, $CZ$, $H$, $H$ — 7 гейтов.
pitfalls:
  - 'Схема с четырьмя $X$: 9 гейтов при бюджете 7.'
  - 'Один $CZ$ между слоями $H$: это отражение относительно состояния $H^{\otimes2}|11\rangle$, а не $|s\rangle$.'
  - 'Без слоёв $H$: отражение относительно $|00\rangle$.'
