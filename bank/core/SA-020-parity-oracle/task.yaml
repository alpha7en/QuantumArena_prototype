facets:
  input: reg_anc
  answer: generator
  params: [{name: n, kind: size, range: [1, 9]}]
  gates: {mode: basis, set: [cx]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: none
  check: eq_anc_phase
qubits: {data: 'n+1'}
limits: {gates: n}
