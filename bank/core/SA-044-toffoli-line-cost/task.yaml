  output: '$CCX$: управляющие $q_0$, $q_1$, целевой $q_2$'
statement: |
  Три кубита соединены в цепочку $q_0 - q_1 - q_2$. Реализуйте гейт Тоффоли с управляющими $q_0$, $q_1$ и целевым
  $q_2$ с точностью до глобальной фазы. Двухкубитные гейты разрешены только между соседями.

  **Разрешено:** гейты $H$, $T$, $T^\dagger$, $CX$; не больше 14 гейтов $CX$.

  **Оценка.** Верная схема с $c$ гейтами $CX$ получает $\max\left(0,\,100-10\cdot\max(0,\,c-8)\right)$ баллов.
hints:
  - 'Обычное разложение (SA-014) использует $CX$ между всеми тремя парами — на цепочке одна пара недоступна.'
  - 'Выпишите, какая чётность лежит в каждом кубите после каждого $CX$.'
editorial: |
  Четыре раза подряд пара `cx(0, 1)`, `cx(1, 2)`. В кубитах 1 и 2 по очереди оказываются $q_0\oplus q_1$,
  $q_0\oplus q_1\oplus q_2$, $q_0\oplus q_2$, $q_1\oplus q_2$, а в конце — исходные значения. На парных чётностях
  ставится $T^\dagger$, на тройной и на одиночных битах — $T$. Два $H$ на $q_2$ превращают $CCZ$ в $CCX$.
  Итого 8 гейтов $CX$.
pitfalls:
  - 'Замена каждого дальнего $CX$ мостом из четырёх: 12 гейтов $CX$, 60 баллов.'
