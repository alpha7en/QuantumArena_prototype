statement: |
  В отказоустойчивых вычислениях дорогой ресурс — гейты $T$. Реализуйте управляемый гейт $S$ с матрицей
  $\mathrm{diag}(1,1,1,i)$ с точностью до глобальной фазы.

  **Разрешено:** гейты $T$, $T^\dagger$, $CX$; не больше 3 гейтов $T$ и $T^\dagger$ вместе и не больше 2 гейтов $CX$.
hints:
  - 'Гейт $T$ на кубите со значением $v$ даёт фазу $\frac{\pi}{4}v$.'
  - 'После `cx(0, 1)` во втором кубите лежит $a\oplus b$.'
editorial: |
  Нужна фаза $\frac{\pi}{2}ab=\frac{\pi}{4}\left(a+b-(a\oplus b)\right)$. `cx(0, 1)`, $T^\dagger$ на кубите 1 (там
  $a\oplus b$), `cx(0, 1)`, затем $T$ на обоих кубитах.
pitfalls:
  - 'Два гейта $T$ без слагаемого $a\oplus b$: получается $T\otimes T$ с лишними фазами у $|01\rangle$ и $|10\rangle$.'
