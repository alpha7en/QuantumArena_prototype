statement: |
  Кубит находится в произвольном неизвестном состоянии. Постройте схему с одним классическим битом, после
  которой кубит гарантированно окажется в $|0\rangle$. Инструкция `reset` недоступна.

  **Разрешено:** одно измерение, гейт $X$ под классическим условием (`with qc.if_test((бит, 1)):`).
hints:
  - 'После измерения кубит находится в $|0\rangle$ или $|1\rangle$ — и вы знаете, в каком.'
editorial: |
  Измерить кубит в бит $c$; если $c=1$, применить $X$. Это первая задача банка с классической обратной связью:
  гейт зависит от результата измерения внутри той же схемы.
pitfalls:
  - 'Безусловный $X$ после измерения: единица исправляется, а ноль портится.'
