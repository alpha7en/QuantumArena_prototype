statement: |
  Постройте схему на одном кубите, матрица которой **в точности** равна
  $$\begin{pmatrix}0&1\\-1&0\end{pmatrix}.$$
  В этой задаче глобальная фаза учитывается: гейт будет использоваться как управляемый, и общий множитель $-1$
  превратится в наблюдаемый относительный знак.

  **Разрешено:** гейты $X$, $Z$, $H$, $S$; не больше 2 гейтов.
hints:
  - 'Матрица схемы — произведение матриц гейтов в обратном порядке.'
editorial: |
  $ZX=\begin{pmatrix}1&0\\0&-1\end{pmatrix}\begin{pmatrix}0&1\\1&0\end{pmatrix}=\begin{pmatrix}0&1\\-1&0\end{pmatrix}$:
  сначала $X$, затем $Z$. Обратный порядок даёт $XZ=-ZX$ — то же состояние с точностью до фазы, но другой
  управляемый гейт.
pitfalls:
  - 'Порядок «$Z$, затем $X$»: матрица отличается знаком и проходит только проверку «с точностью до фазы».'
