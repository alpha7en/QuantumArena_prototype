statement: |
  Сверхпроводниковый процессор умеет выполнять на одном кубите только гейты $R_z(\lambda)$ с любым углом и
  $\sqrt{X}$ (`sx`). Реализуйте на нём гейт Адамара с точностью до глобальной фазы.

  **Разрешено:** гейты $R_z$, $\sqrt{X}$; не больше 3 гейтов.
hints:
  - '$\sqrt{X}$ — поворот вокруг оси $x$ на $\frac{\pi}{2}$. Любой однокубитный гейт раскладывается на повороты $z$–$x$–$z$.'
editorial: |
  `rz(pi/2)`, `sx`, `rz(pi/2)`. Поворот вокруг $z$ на четверть оборота переводит ось $x$ в $y$, поэтому тройка
  реализует поворот на $\frac{\pi}{2}$ вокруг $y$ с дополнительными фазами — это и есть $H$ с точностью до
  множителя.
pitfalls:
  - 'Один гейт $\sqrt{X}$ даёт равные вероятности из $|0\rangle$, но не $H$: фазы другие.'
