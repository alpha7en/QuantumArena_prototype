statement: |
  Гейт `oracle` на двух кубитах меняет знак амплитуды ровно у одного базисного состояния $|w\rangle$, $w\in\{0,1,2,3\}$;
  какого — неизвестно. Напишите функцию `solve(oracle)`. Она возвращает схему на двух кубитах с двумя
  классическими битами (кубит $i$ измеряется в бит $i$), измерение которой даёт $w$ с вероятностью 1.

  **Разрешено:** гейты $H$, $X$, $Z$, $CZ$, измерения в конце; оракул — один раз; не больше 12 гейтов вместе с
  оракулом.
hints:
  - 'После оракула нужно отражение относительно равной суперпозиции.'
  - 'Отражение относительно $|00\rangle$ — это гейты $X$ вокруг $CZ$.'
editorial: |
  $H$ на обоих кубитах, оракул, затем диффузия: $H$, $X$, $CZ$, $X$, $H$. Угол поворота за итерацию равен
  $2\arcsin\frac{1}{\sqrt4}=60^\circ$, начальный угол $30^\circ$, после одной итерации — ровно $90^\circ$.
pitfalls:
  - 'Измерить сразу после оракула: знак не виден, все исходы равновероятны.'
