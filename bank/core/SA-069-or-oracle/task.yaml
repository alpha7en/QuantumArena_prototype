  key_idea: 'ИЛИ — это отрицание И от отрицаний; то же самое многочленом: $a\vee b=a\oplus b\oplus ab$.'
source: {kind: real, ref: 'QuantumKatas MarkingOracles / GroversAlgorithm (оракул ИЛИ)', note: 'условие написано заново, фиксированный размер'}
