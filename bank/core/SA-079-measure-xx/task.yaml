  key_idea: 'Собственное значение $X\otimes X$ — это чётность двух битов в базисе $X$: $H$ на обоих кубитах, $CX$ собирает чётность в один кубит, измеряется только он.'
source: {kind: adapted, ref: 'Xanadu QHack 2023 (энергия молекулы водорода, разобранная задача 047): оценка паулиевых слагаемых', note: 'одна паулиева строка, одно измерение'}
gui: true
io:
  input: 'произвольное состояние двух кубитов $|\psi\rangle$'
  output: 'бит $c_0$ с $P(c_0=1)=\frac{1-\langle\psi|X\otimes X|\psi\rangle}{2}$'
statement: |
  Два кубита находятся в произвольном состоянии $|\psi\rangle$. Постройте схему с одним классическим битом $c_0$,
  которая измеряет наблюдаемую $X\otimes X$: бит равен 0, если получено собственное значение $+1$, и 1, если $-1$.
  Иначе говоря, для любого $|\psi\rangle$
  $$P(c_0=1)=\frac{1-\langle\psi|X\otimes X|\psi\rangle}{2}.$$
  Тогда среднее $\langle X\otimes X\rangle$ оценивается по доле единиц в серии запусков: так считают слагаемые
  энергии в вариационных алгоритмах.

  **Разрешено:** гейты $H$, $CX$ и одно измерение в конце; не больше 3 гейтов.
hints:
  - 'Собственные состояния $X\otimes X$ — это $|{+}{+}\rangle$, $|{-}{-}\rangle$ (значение $+1$) и $|{+}{-}\rangle$, $|{-}{+}\rangle$ (значение $-1$). После $H$ на обоих кубитах они станут базисными строками.'
  - 'Нужен не каждый бит по отдельности, а их сумма по модулю 2 — и измерение всего одно.'
editorial: |
  $H$ на обоих кубитах переводит измерение $X\otimes X$ в измерение $Z\otimes Z$, то есть чётности двух битов.
  Гейт `cx(0, 1)` записывает чётность $q_0\oplus q_1$ в кубит $q_1$; он и измеряется в $c_0$. Измерять оба кубита
  по отдельности не требуется — и для настоящего измерения $X\otimes X$ вредно: оно сообщило бы больше, чем одно
  собственное значение.
pitfalls:
  - 'Без гейтов $H$ измеряется $Z\otimes Z$.'
  - '$H$ и измерение одного кубита: это наблюдаемая $X\otimes I$.'
  - 'Гейт $H$ только на одном кубите: измеряется $X\otimes Z$ или $Z\otimes X$.'
