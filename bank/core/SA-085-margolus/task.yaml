title: Почти Тоффоли за три CX
status: reference
level: 3
tree: {trunk: T5, branch: T5.3, hybrid: [T2.2, T5.4]}
facets:
  input: any
  answer: fixed
  params: []
  gates: {mode: basis, set: [ry, cx]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: none
  check: eq_phase
qubits: {data: 3}
