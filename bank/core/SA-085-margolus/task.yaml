signature: 'solve() -> QuantumCircuit'
method:
  kind: constraint
  elements: [Тоффоли с относительной фазой, повороты вокруг $Y$ как «половинки» отражения, жёсткий бюджет CX]
  key_idea: 'Четыре поворота $R_y\left(\pm\frac{\pi}{4}\right)$ на целевом кубите, между ними $CX$ от управляющих: каждый $CX$ меняет знак соседних поворотов. При $q_0=q_1=1$ они складываются в $X$, в остальных случаях сокращаются — с точностью до знака.'
source: {kind: adapted, ref: 'N. Margolus, 1994; D. Maslov, 2016 (Тоффоли с относительной фазой); IBM Quantum Challenge 2021, Ex. 1 (стоимость Тоффоли)', note: 'цель — конкретная матрица, бюджет вдвое меньше, чем у точного Тоффоли'}
gui: true
io:
  input: 'произвольное состояние трёх кубитов'
  output: '$CCX$ (управление $q_0,q_1$, цель $q_2$) со знаком минус у $|q_2q_1q_0\rangle=|101\rangle$'
statement: |
  Точный гейт Тоффоли требует 6 гейтов $CX$ (SA-014). Если после него стоит развычисление, годится и «почти
  Тоффоли» — гейт Марголуса $M$. Он переставляет базисные состояния так же, как $CCX$ с управляющими $q_0,q_1$ и
  целевым $q_2$, но одно состояние получает знак минус:
  $$M\,|q_2q_1q_0\rangle=\begin{cases}-|101\rangle, & q_2q_1q_0=101,\\[2pt] |q_2\oplus q_1q_0,\;q_1,\;q_0\rangle & \text{иначе.}\end{cases}$$
  Реализуйте $M$ с точностью до глобальной фазы.

  **Разрешено:** гейты $R_y(\theta)=\begin{pmatrix}\cos\frac{\theta}{2}&-\sin\frac{\theta}{2}\\ \sin\frac{\theta}{2}&\cos\frac{\theta}{2}\end{pmatrix}$
  с углами $\pm\frac{\pi}{4}$ и $CX$; не больше 7 гейтов, из них не больше 3 гейтов $CX$.
hints:
  - 'Все однокубитные гейты стоят на целевом кубите $q_2$. Гейт $CX$ с целевым $q_2$ — это $X$ на нём, а $X\,R_y(\theta)\,X=R_y(-\theta)$.'
  - 'Схема симметрична: $R_y$, `cx(1, 2)`, $R_y$, `cx(0, 2)`, $R_y$, `cx(1, 2)`, $R_y$. Подберите знаки углов так, чтобы при $q_0=q_1=0$ повороты сократились.'
editorial: |
  На $q_2$ по порядку: $R_y\left(\frac{\pi}{4}\right)$, `cx(1, 2)`, $R_y\left(\frac{\pi}{4}\right)$, `cx(0, 2)`,
  $R_y\left(-\frac{\pi}{4}\right)$, `cx(1, 2)`, $R_y\left(-\frac{\pi}{4}\right)$. Разбор по значениям управляющих
  (обозначим $A=R_y\left(\frac{\pi}{4}\right)$):

  - $q_1=q_0=0$: $A^\dagger A^\dagger AA=I$;
  - $q_1=1$, $q_0=0$: $A^\dagger XA^\dagger\cdot AXA=I$;
  - $q_1=0$, $q_0=1$: $A^\dagger A^\dagger XAA=R_y\left(-\frac{\pi}{2}\right)X\,R_y\left(\frac{\pi}{2}\right)=Z$ — отсюда знак минус у $|101\rangle$;
  - $q_1=q_0=1$: $A^\dagger XA^\dagger XAXA=X$.

  Получается $CCX$, умноженный на диагональ со знаком минус у $|101\rangle$. В паре «вычислить — развычислить» такие
  знаки сокращаются, поэтому в лестницах многоконтрольных гейтов (SA-024) точные Тоффоли заменяют на эти и
  экономят половину $CX$.
pitfalls:
  - 'Все четыре угла одного знака: при $q_0=q_1=0$ остаётся поворот $R_y(\pi)$ вместо тождественного.'
  - 'Средний $CX$ от того же управляющего, что и крайние: второй управляющий кубит не участвует.'
  - 'Точное разложение Тоффоли: 6 гейтов $CX$ при бюджете 3.'
