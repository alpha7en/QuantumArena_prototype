io:
  input: 'состояние кода Стина на $q_0..q_6$ с переворотом не более одного кубита; $q_7,q_8,q_9$ в $|0\rangle$'
  output: 'данные без изменений; $q_7q_8q_9$ — двоичная запись номера испорченного кубита плюс один'
statement: |
  Семь кубитов $q_0,\dots,q_6$ хранят логический кубит в коде Стина $[[7,1,3]]$; на один из них (или ни на один)
  подействовала ошибка $X$. Кубиты $q_7,q_8,q_9$ находятся в $|0\rangle$. Постройте схему, которая записывает в
  них синдром: число $s=q_7+2q_8+4q_9$ должно стать равным $i+1$, если ошибка на кубите $q_i$, и $0$, если
  ошибки нет. Кубиты данных должны остаться в прежнем состоянии, измерений нет.

  Кодовые слова кода Стина — суперпозиции строк $x_0\dots x_6$, у которых равны нулю три чётности: для
  $k=0,1,2$ сумма по модулю 2 тех $x_i$, у которых бит $k$ числа $i+1$ равен единице.

  **Разрешено:** только гейты $CX$; не больше 12 гейтов.
hints:
  - 'Ошибка на кубите $q_i$ меняет ровно те чётности, в которые входит $x_i$.'
editorial: |
  Для каждого $k=0,1,2$ гейты `cx(i, 7+k)` от всех $i$, у которых бит $k$ числа $i+1$ равен 1: по четыре гейта на
  проверку. Без ошибки все чётности нулевые. Ошибка на $q_i$ переворачивает проверки, соответствующие единичным
  битам $i+1$, — в анциллах оказывается двоичная запись $i+1$. Синдром одинаков для всех слагаемых суперпозиции,
  поэтому анциллы не запутываются с данными.
pitfalls:
  - 'Нумерация с нуля: синдром $0$ тогда означает и «нет ошибки», и «ошибка на $q_0$».'
