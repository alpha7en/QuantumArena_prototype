  key_idea: 'Средний кубит дважды участвует в сумме и сокращается: мост из четырёх $CX$ вместо обменов.'
source: {kind: adapted, ref: 'презентация классификации, T5.1 (маршрутизация CNOT через SWAP)', note: 'бюджет ужесточён: маршрут через SWAP стоит 7 CX и не проходит'}
gui: true
io:
  input: 'произвольное состояние трёх кубитов на цепочке $q_0 - q_1 - q_2$'
  output: '$CX$ с управляющим $q_0$ и целевым $q_2$; $q_1$ не меняется'
statement: |
  Три кубита соединены в цепочку $q_0 - q_1 - q_2$; двухкубитные гейты разрешены только между соседями.
  Реализуйте $CX$ с управляющим кубитом $q_0$ и целевым $q_2$. Кубит $q_1$ находится в произвольном состоянии и
  после схемы должен остаться прежним.

  **Разрешено:** только гейты $CX$ между соседями; не больше 4 гейтов.
hints:
  - 'Перестановка $q_0$ и $q_1$ гейтом $SWAP$, $CX$ и обратная перестановка — это 7 гейтов $CX$.'
  - 'Что окажется в $q_2$ после `cx(0, 1)` и `cx(1, 2)`?'
editorial: |
  `cx(0, 1)`, `cx(1, 2)`, `cx(0, 1)`, `cx(1, 2)`. После двух гейтов в $q_2$ прибавлено $q_0\oplus q_1$; третий
  гейт возвращает $q_1$, четвёртый прибавляет к $q_2$ ещё раз $q_1$. Остаётся $q_2\oplus q_0$.
pitfalls:
  - 'Два гейта: $q_1$ испорчен, а в $q_2$ лишнее слагаемое.'
