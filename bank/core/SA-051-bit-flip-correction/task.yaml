signature: 'solve() -> QuantumCircuit'
method:
  kind: combo
  elements: [синдром чётностей, промежуточное измерение, таблица исправлений]
  key_idea: 'Две чётности $q_0\oplus q_1$ и $q_1\oplus q_2$ указывают на перевёрнутый кубит и ничего не сообщают о данных.'
source: {kind: real, ref: 'IBM Quantum Challenge 2021, Exercise 3; QOSF Monthly Challenge 2021-02, Task 2; презентация классификации, T6.2', note: 'условие написано заново; запрет $CCX$ вынуждает измерять синдром'}
gui: true
io:
  input: '$\alpha|000\rangle+\beta|111\rangle$ с переворотом не более одного кубита; две анциллы в $|0\rangle$'
  output: 'кубиты данных в $\alpha|000\rangle+\beta|111\rangle$ при любых исходах измерений'
statement: |
  Кубиты $q_0,q_1,q_2$ хранят логический кубит в коде повторения $\alpha|000\rangle+\beta|111\rangle$. На один из
  них (или ни на один) подействовала ошибка $X$. Кубиты $q_3$, $q_4$ — вспомогательные, в $|0\rangle$. Постройте
  схему с двумя классическими битами, после которой кубиты данных снова находятся в состоянии
  $\alpha|000\rangle+\beta|111\rangle$ — для любых $\alpha$, $\beta$, любого места ошибки и любых исходов
  измерений.

  **Разрешено:** гейты $X$, $CX$, измерения, гейты под классическим условием — по одному биту
  `qc.if_test((бит, 1))` или по регистру `qc.if_test((qc.cregs[0], значение))`; не больше 4 гейтов $CX$ и 2
  измерений. Измерять кубиты данных нельзя: это разрушит суперпозицию.
hints:
  - 'Чётность двух кубитов данных можно записать в анциллу двумя $CX$.'
  - 'Составьте таблицу: какая пара чётностей соответствует ошибке на $q_0$, $q_1$, $q_2$.'
editorial: |
  `cx(0, 3)`, `cx(1, 3)` пишут в $q_3$ чётность $q_0\oplus q_1$; `cx(1, 4)`, `cx(2, 4)` — чётность
  $q_1\oplus q_2$ в $q_4$. Измеряем $q_3\to c_0$, $q_4\to c_1$. Таблица: $(c_0,c_1)=(1,0)$ — ошибка на $q_0$;
  $(1,1)$ — на $q_1$; $(0,1)$ — на $q_2$; $(0,0)$ — ошибки нет. Соответствующий $X$ ставится под условием на
  значение регистра $c_0+2c_1$.
pitfalls:
  - 'Перепутать строки таблицы: исправляется не тот кубит, и ошибок становится две.'
