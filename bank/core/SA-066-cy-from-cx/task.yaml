io:
  input: 'произвольное состояние двух кубитов'
  output: '$CY$: гейт $Y$ на $q_1$, если $q_0=1$'
statement: |
  Реализуйте управляемый гейт $Y$: если кубит $q_0$ равен 1, к кубиту $q_1$ применяется
  $$Y=\begin{pmatrix}0&-i\\ i&0\end{pmatrix},$$
  иначе ничего не происходит. Схема должна быть верна для любого входного состояния.

  **Разрешено:** гейты $S$, $S^\dagger$, $CX$; не больше 3 гейтов.
hints:
  - 'Вычислите произведение $S\,X\,S^\dagger$.'
  - 'В схеме гейты идут слева направо, в произведении матриц — справа налево.'
editorial: |
  $S^\dagger$ на целевом кубите, `cx(0, 1)`, $S$ на целевом. При $q_0=0$ гейты $S^\dagger$ и $S$ сокращаются; при
  $q_0=1$ на целевом кубите получается $S\,X\,S^\dagger=Y$. Если поменять $S$ и $S^\dagger$ местами, выйдет
  $S^\dagger X S=-Y$: под управлением знак минус становится относительной фазой, и это уже другой гейт.
pitfalls:
  - 'Порядок «$S$, $CX$, $S^\dagger$» даёт управляемый $-Y$, а не $CY$.'
  - 'Гейт $CX$ без сопряжения: у $X$ нет мнимых элементов.'
