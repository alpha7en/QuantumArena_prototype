io:
  input: 'кубит в произвольном состоянии'
  output: 'бит $c_0$ — исход измерения $X$; кубит в $|+\rangle$ при $c_0=0$ и в $|-\rangle$ при $c_0=1$'
statement: |
  Кубит находится в произвольном состоянии $|\psi\rangle$. Постройте схему с одним классическим битом $c_0$,
  которая измеряет кубит в базисе $|\pm\rangle=\frac{1}{\sqrt2}\left(|0\rangle\pm|1\rangle\right)$ и оставляет его в
  измеренном состоянии:

  - $c_0=0$ с вероятностью $|\langle+|\psi\rangle|^2$, и тогда кубит после схемы находится в $|+\rangle$;
  - $c_0=1$ с вероятностью $|\langle-|\psi\rangle|^2$, и тогда кубит после схемы находится в $|-\rangle$.

  Измерение стоит в середине схемы: после него к кубиту ещё применяются гейты.

  **Разрешено:** гейт $H$ и одно измерение; не больше 2 гейтов.
hints:
  - 'Гейт $H$ переводит $|+\rangle$ в $|0\rangle$ и $|-\rangle$ в $|1\rangle$. После измерения кубит оказался в $|0\rangle$ или $|1\rangle$ — а должен быть в $|+\rangle$ или $|-\rangle$.'
editorial: |
  $H$, измерение, снова $H$. Первый $H$ переводит базис $X$ в вычислительный, измерение проецирует кубит на
  $|0\rangle$ или $|1\rangle$, второй $H$ возвращает проекцию в базис $X$. Без второго $H$ бит $c_0$ верный, но
  кубит остаётся в $|0\rangle$ или $|1\rangle$: повторное измерение $X$ дало бы случайный ответ, а у настоящего
  проективного измерения повтор всегда воспроизводит результат.
pitfalls:
  - 'Нет второго $H$: бит верный, состояние после измерения — нет.'
  - 'Измерение без гейтов: это измерение в базисе $Z$.'
  - 'Оба $H$ до измерения: они сокращаются.'
