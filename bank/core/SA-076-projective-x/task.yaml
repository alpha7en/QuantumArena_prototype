  key_idea: 'Проективное измерение в базисе $X$ — это измерение в вычислительном базисе между двумя $H$: первый меняет базис, второй возвращает.'
source: {kind: adapted, ref: 'IBM Quantum Challenge Spring 2023, Lab 1 (промежуточные измерения); QuantumKatas Measurements', note: 'условие написано заново'}
