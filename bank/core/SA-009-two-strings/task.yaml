  input: zero
  answer: generator
  params:
    - {name: n, kind: size, range: [1, 10]}
    - {name: a, kind: data, note: 'целое, $0\le a<2^n$'}
    - {name: b, kind: data, note: 'целое, $0\le b<2^n$, $b\ne a$'}
