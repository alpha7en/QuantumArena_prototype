id: SA-025
slug: decrement
title: Декремент по модулю степени двойки
status: reference
level: 2
tree: {trunk: T3, branch: T3.4}
facets:
  input: reg_anc
  answer: generator
  params: [{name: n, kind: size, range: [1, 8]}]
  gates: {mode: basis, set: [x, mcx]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: none
  check: eq_phase
qubits: {data: n}
limits: {gates: n}
signature: 'solve(n: int) -> QuantumCircuit'
method:
  kind: combo
  elements: [арифметика на месте, заём, порядок гейтов]
  key_idea: 'Заём идёт через младшие нули: после инверсии младшего бита условие заёма — «все младшие равны 1».'
source: {kind: real, ref: 'QCoder QPC004 A5', note: 'условие написано заново; эталон совпадает по идее с ladder_ec B16 (dec_prefix)'}
gui: false
io:
  input: '$|x\rangle$, $0\le x<2^n$'
  output: '$|(x-1)\bmod 2^n\rangle$'
statement: |
  Напишите функцию `solve(n)`, которая для $1\le n\le 8$ возвращает схему вычитания единицы:
  $$|x\rangle\;\longmapsto\;|(x-1)\bmod 2^n\rangle .$$
  Кубит $i$ — бит $i$ числа $x$. Схема должна быть верна для любой суперпозиции.

  **Разрешено:** гейты $X$, многоконтрольный $X$ (`mcx`); не больше $n$ гейтов; вспомогательных кубитов нет.
hints:
  - 'Бит $i$ меняется при вычитании единицы, когда все младшие биты равны нулю.'
  - 'Порядок гейтов решает, какие значения — старые или новые — видят управляющие кубиты.'
editorial: |
  Сначала $X$ на кубите 0. Затем для $i=1,\dots,n-1$ гейт `mcx` с управляющими $0,\dots,i-1$ и целевым $i$. К
  моменту гейта $i$ младшие биты уже обновлены: они все равны 1 ровно тогда, когда раньше были нулями, то есть
  когда заём дошёл до бита $i$. Те же гейты в обратном порядке дают инкремент.
pitfalls:
  - 'Обратный порядок гейтов: получается прибавление единицы.'
