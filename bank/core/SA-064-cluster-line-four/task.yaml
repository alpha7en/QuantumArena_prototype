  elements: [графовое состояние, коммутирующие CZ]
  key_idea: 'Графовое состояние — это $|+\rangle$ на каждой вершине и $CZ$ на каждом ребре; гейты $CZ$ коммутируют, поэтому рёбра без общих вершин ставятся в один слой.'
source: {kind: adapted, ref: 'презентация классификации, T1.4 (линейный кластер); R. Raussendorf, H. Briegel, 2001', note: 'фиксированный размер и бюджет глубины'}
gui: true
io:
  input: '$|0000\rangle$ на цепочке $q_0 - q_1 - q_2 - q_3$'
  output: '$CZ_{01}\,CZ_{12}\,CZ_{23}\,|{+}{+}{+}{+}\rangle$'
statement: |
  Четыре кубита в состоянии $|0000\rangle$ соединены в цепочку $q_0 - q_1 - q_2 - q_3$. Получите линейное
  кластерное состояние
  $$|C_4\rangle=CZ_{01}\,CZ_{12}\,CZ_{23}\,|{+}{+}{+}{+}\rangle,\qquad |+\rangle=\frac{1}{\sqrt2}\left(|0\rangle+|1\rangle\right).$$

  **Разрешено:** гейты $H$ и $CZ$ между соседями по цепочке; не больше 7 гейтов, глубина не больше 3.
hints:
  - 'Формула в условии — уже схема: сначала $|+\rangle$ на каждом кубите, потом $CZ$ по рёбрам.'
  - 'Гейты $CZ_{01}$ и $CZ_{23}$ не имеют общих кубитов и выполняются одновременно.'
editorial: |
  Слой из четырёх $H$, затем три $CZ$. Все $CZ$ диагональны и коммутируют, так что порядок свободный: $CZ_{01}$ и
  $CZ_{23}$ ставятся в один слой, $CZ_{12}$ — в следующий. Итого глубина 3. Если ставить рёбра подряд слева
  направо, глубина равна 4.
pitfalls:
  - 'Пропущено среднее ребро: получаются две отдельные пары, а не цепочка.'
  - 'Рёбра подряд $CZ_{01}$, $CZ_{12}$, $CZ_{23}$: состояние верное, но глубина 4.'
