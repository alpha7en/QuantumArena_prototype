facets:
  input: zero
  answer: generator
  params: [{name: n, kind: size, range: [2, 10]}]
  gates: {mode: basis, set: [x, ry, cry, cx]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: none
