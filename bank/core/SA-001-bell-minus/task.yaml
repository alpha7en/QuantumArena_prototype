io:
  input: '$|00\rangle$'
  output: '$\frac{1}{\sqrt{2}}\left(|00\rangle-|11\rangle\right)$'
statement: |
  Два кубита находятся в состоянии $|00\rangle$. Получите состояние
  $$|\Phi^-\rangle=\frac{1}{\sqrt{2}}\left(|00\rangle-|11\rangle\right).$$
  Глобальная фаза не учитывается.

  **Разрешено:** гейты $H$, $X$, $Z$, $CX$; не больше 3 гейтов.
hints:
  - 'Сначала получите $|\Phi^+\rangle$: $H$ на первом кубите и $CX$.'
  - 'Гейт $Z$ меняет знак амплитуды у состояний, где его кубит равен 1.'
editorial: |
  $H$ и $CX$ дают $\frac{1}{\sqrt2}(|00\rangle+|11\rangle)$. Гейт $Z$ на любом из двух кубитов умножает
  $|11\rangle$ на $-1$ и не трогает $|00\rangle$. Равноценный вариант: $X$, затем $H$ на первом кубите, затем $CX$.
pitfalls:
  - 'Остановиться на $|\Phi^+\rangle$: модули амплитуд совпадают, знак — нет.'
