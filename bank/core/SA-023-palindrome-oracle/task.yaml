facets:
  input: reg_anc
  answer: fixed
  params: []
  gates: {mode: basis, set: [x, cx, ccx]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: none
  check: eq_phase
qubits: {data: 5}
