  input: any
  answer: fixed
  params: []
  gates: {mode: basis, set: [h, cp]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: none
  check: eq_phase
qubits: {data: 2}
limits: {gates: 3}
signature: 'solve() -> QuantumCircuit'
method:
  kind: reverse
  elements: [обратная схема, знак угла, порядок гейтов]
  key_idea: 'Обратная схема — те же гейты в обратном порядке, каждый заменён на обратный: $H^\dagger=H$, $CP(\varphi)^\dagger=CP(-\varphi)$.'
source: {kind: adapted, ref: 'QCoder QPC002 B4 (Quantum Fourier Transform); QuantumKatas QFT (обратное преобразование)', note: 'вместо построения QFT требуется обратить данную схему'}
gui: true
io:
  input: 'произвольное состояние двух кубитов'
  output: '$V^\dagger$ для схемы $V$: $H$ на $q_1$, $CP\left(\frac{\pi}{2}\right)$, $H$ на $q_0$'
statement: |
  Дана схема $V$ на двух кубитах — преобразование Фурье без завершающей перестановки. Гейты идут в таком порядке:

  1. $H$ на кубите $q_1$;
  2. управляемая фаза $CP\left(\frac{\pi}{2}\right)$ между $q_0$ и $q_1$ (умножает амплитуду при $|11\rangle$ на $i$);
  3. $H$ на кубите $q_0$.

  Постройте схему, которая отменяет $V$: после $V$ и вашей схемы любое входное состояние возвращается в исходное
  (с точностью до глобальной фазы).

  **Разрешено:** гейты $H$ и $CP(\varphi)$ с углом, кратным $\frac{\pi}{2}$; не больше 3 гейтов.
hints:
  - 'Обратное к произведению — произведение обратных в противоположном порядке: $(AB)^{-1}=B^{-1}A^{-1}$.'
  - 'Какой гейт отменяет $CP\left(\frac{\pi}{2}\right)$?'
editorial: |
  $V=H_0\cdot CP\left(\frac{\pi}{2}\right)\cdot H_1$ (в произведении первый гейт стоит справа), поэтому
  $V^\dagger=H_1\cdot CP\left(-\frac{\pi}{2}\right)\cdot H_0$: сначала $H$ на $q_0$, затем $CP\left(-\frac{\pi}{2}\right)$,
  затем $H$ на $q_1$. Нужны оба изменения сразу. Если только развернуть порядок, получится транспонированная матрица
  $V^{T}$; если только сменить знак угла — комплексно сопряжённая $V^{*}$. Обе отличаются от $V^\dagger$.
pitfalls:
  - 'Только обратный порядок без смены знака угла: получается $V^{T}$.'
  - 'Только смена знака угла без разворота порядка: получается $V^{*}$.'
  - 'Повторить схему $V$: она не обратна самой себе.'
