title: Экспонента XX за пять гейтов
status: reference
level: 2
tree: {trunk: T8, branch: T8.1, hybrid: [T2.1]}
facets:
  input: any
  answer: fixed
  params: []
  gates: {mode: basis, set: [h, cx, rz]}
  coupling: all
  ancilla: {kind: none, max: 0}
  measure: none
  check: eq_phase
qubits: {data: 2}
