  key_idea: 'Множитель перед гейтом под управлением — это фазовый гейт на управляющем кубите.'
source: {kind: own, ref: 'sparq arena'}
gui: true
io:
  input: 'произвольное состояние двух кубитов'
  output: 'управляемый $R_x(\pi)=-iX$: управление $q_0$, цель $q_1$'
statement: |
  Поворот $R_x(\pi)=e^{-i\frac{\pi}{2}X}=-iX$ отличается от гейта $X$ только множителем $-i$. Реализуйте его
  управляемую версию: если $q_0=1$, к кубиту $q_1$ применяется $-iX$, иначе ничего не происходит:
  $$U=|0\rangle\langle0|\otimes I+|1\rangle\langle1|\otimes(-iX).$$
  Матрица схемы должна совпасть с $U$ точно.

  **Разрешено:** гейты $S$, $S^\dagger$, $Z$, $CX$; не больше 2 гейтов.
hints:
  - 'Гейт $CX$ применяет $X$ при $q_0=1$. Не хватает множителя $-i$ — но только в ветви $q_0=1$.'
  - 'Какой однокубитный гейт умножает на $-i$ состояние $|1\rangle$ и не трогает $|0\rangle$?'
editorial: |
  `cx(0, 1)` и $S^\dagger$ на управляющем кубите $q_0$ (в любом порядке — они коммутируют). Множитель $-i$ нужен
  ровно в тех слагаемых, где $q_0=1$, а это и есть действие $S^\dagger=\mathrm{diag}(1,-i)$ на $q_0$. Общий
  принцип: глобальная фаза гейта под управлением перестаёт быть глобальной и переезжает на управляющий кубит.
pitfalls:
  - 'Один $CX$: «с точностью до фазы» $X$ и $-iX$ совпадают, но их управляемые версии — разные гейты.'
  - 'Гейт $S$ вместо $S^\dagger$ даёт управляемый $+iX$, то есть $R_x(-\pi)$.'
  - 'Фазовый гейт на целевом кубите: фаза должна зависеть от $q_0$, а не от $q_1$.'
