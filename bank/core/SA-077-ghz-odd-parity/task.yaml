io:
  input: '$\frac{1}{\sqrt2}\left(|000\rangle+|111\rangle\right)$, по кубиту у каждого из трёх участников'
  output: 'биты $c_0,c_1,c_2$ с $c_0\oplus c_1\oplus c_2=1$ — всегда'
statement: |
  Три участника делят состояние $\frac{1}{\sqrt2}\left(|000\rangle+|111\rangle\right)$: кубит $q_k$ — у участника
  $k$. Участники не общаются: каждый применяет однокубитные гейты к своему кубиту и измеряет его в бит $c_k$.
  Постройте схему, в которой сумма результатов всегда нечётна:
  $$c_0\oplus c_1\oplus c_2=1\quad\text{с вероятностью }1.$$
  Схема получает на вход уже готовое состояние GHZ. Если измерить кубиты сразу, сумма окажется случайной: исходы
  $000$ и $111$ равновероятны.

  **Разрешено:** однокубитные гейты $H$, $S$, $S^\dagger$, $X$, $Z$ и по одному измерению на кубит в конце; не
  больше 5 гейтов.
hints:
  - 'Измерение в базисе $X$ — это $H$ перед измерением. Разложите GHZ по состояниям $|\pm\rangle$: сколько минусов встречается в каждом слагаемом?'
  - 'Знак между $|000\rangle$ и $|111\rangle$ определяет, чётное или нечётное число минусов. Его меняет один гейт.'
editorial: |
  $H^{\otimes3}$ переводит $|000\rangle+|111\rangle$ в суперпозицию строк с чётным числом единиц, а
  $|000\rangle-|111\rangle$ — с нечётным. Значит, достаточно сменить знак гейтом $Z$ на любом кубите и измерить все
  три в базисе $X$: $Z$, $H$, $H$, $H$. Другой вариант — измерить один кубит в базисе $X$, а два других в базисе
  $Y$ ($S^\dagger$, затем $H$): GHZ — собственное состояние $X\otimes Y\otimes Y$ с значением $-1$. Каждый бит по
  отдельности остаётся случайным; предсказуема только сумма. На этом построена игра GHZ (SA-055).
pitfalls:
  - '$H$ на всех кубитах без смены знака: сумма всегда чётна.'
  - 'Гейт $X$ и измерение в вычислительном базисе: исходы $001$ и $110$, сумма снова случайна.'
  - 'Базис $Y$ только у одного участника: сумма случайна.'
