- {id: SR-006, level: 1, branch: T1.1, f: [zero, generator, eq0_phase], m: fact, src: 'QCoder QPC001 A2; ladder_ec Q02', title: 'Равная суперпозиция всех строк', idea: 'Слой $H$ на $n$ кубитах, глубина 1.'}
