# Резервный банк sparq arena: идеи задач на будущее.
# Статус каждой записи — idea: есть механика, источник и место в дереве; нет полного условия, эталона и тестов.
# Чтобы перевести запись в ядро, оформите пакет bank/core/SA-xxx-slug/ и пройдите bank/tools/verify.py.
# Поля: id, level (1–3), branch (ветвь из tree.yaml), f = [вход, ответ, проверка], m = способ составления,
# src = источник, title, idea. Значения f и m — те же, что в карточке задачи (см. CLASSIFICATION.md).
version: 1
tasks:
# ---------------------------------------------------------------- T1. Подготовка состояния
- {id: SR-001, level: 1, branch: T1.1, f: [zero, fixed, eq0], m: fact, src: 'QCoder QPC002 A1', title: 'Минус ноль', idea: 'Получить $-|0\rangle$: глобальная фаза учитывается. Знак даёт $XZX$ или $ZXZX$.'}
- {id: SR-003, level: 1, branch: T1.1, f: [zero, generator, eq0_phase], m: fact, src: 'демо v2 (rot-prep)', title: 'Поворот на заданный угол', idea: 'Состояние $\cos\frac{\theta}{2}|0\rangle+\sin\frac{\theta}{2}|1\rangle$ одним гейтом; параметр — угол.'}
