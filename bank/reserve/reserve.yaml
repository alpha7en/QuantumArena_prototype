- {id: SR-018, level: 1, branch: T1.4, f: [zero, generator, eq0_phase], m: fact, src: 'презентация классификации, T1.4', title: 'Линейный кластер', idea: 'Слой $H$ и $CZ$ между соседями, глубина 3.'}
